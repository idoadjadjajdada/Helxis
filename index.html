  const shells = [];
  let acc = zeroComp(), accM = 0, accT = 0;
  for (let k = 0; k < members.length; k++) {
    const i = members[k];
    acc[M.mat[i]] += M.m[i]; accM += M.m[i]; accT += M.m[i] * M.T[i];
    const done = (shells.length < nBins - 1 && accM >= per) ||
                 k === members.length - 1;
    if (done) {
      shells.push({ comp: acc, T: accM > 0 ? accT / accM : AMBIENT_T });
      acc = zeroComp(); accM = 0; accT = 0;
    }
  }
  if (!shells.length) return;

  const b = new Body({ x: c.cx, y: c.cy, vx: c.vx, vy: c.vy, shells, spin: c.omega });
  b.surfaceMap = projectSurface(members, c, b.radius);
  W.bodies.push(b);
  W.events.push({ kind: 'settle', id: b.id, t: W.t });

  /* the motes it was made of stay, weightless and no longer part of
   * anything, to fall the last of the way in.  Their mass is already in
   * the body, so the books balance during the fade.                       */
  for (const i of members) {
    M.m[i] = 0; M.ghost[i] = 1; M.age[i] = 0; M.clump[i] = -1;
    const dx = b.x - M.x[i], dy = b.y - M.y[i];
    const d = Math.hypot(dx, dy) || 1;
    M.vx[i] = b.vx + dx / d * 0.4; M.vy[i] = b.vy + dy / d * 0.4;
  }
}

/* ---- the sprite is projected, not generated ---------------------------- *
 *  For each pixel of the new body's disc, take the outermost mote along
 *  that line and paint its material at its temperature.  Two identical
 *  collisions give two different worlds, and none of it is authored.      *
 * ---------------------------------------------------------------------- */
const SURF_N = 44;
function projectSurface(members, c, bodyRadius) {
  const M = Motes;
  const mat = new Uint8Array(SURF_N * SURF_N).fill(255);
  const T = new Float32Array(SURF_N * SURF_N);
  const span = Math.max(c.R, 1e-6);
  /* bucket the members so the lookup is not members-squared */
  const cell = Math.max(span * 2 / SURF_N, 1e-9);
  const buckets = new Map();
  for (const i of members) {
    const gx = Math.floor((M.x[i] - c.cx) / cell), gy = Math.floor((M.y[i] - c.cy) / cell);
    const k = gx * 8192 + gy;
    let a = buckets.get(k); if (!a) buckets.set(k, a = []);
    a.push(i);
  }
  for (let v = 0; v < SURF_N; v++) for (let u = 0; u < SURF_N; u++) {
    const nx = (u + 0.5) / SURF_N * 2 - 1, ny = (v + 0.5) / SURF_N * 2 - 1;
    if (nx * nx + ny * ny > 1) continue;
    const px = nx * span, py = ny * span;
    const gx = Math.floor(px / cell), gy = Math.floor(py / cell);
    let best = -1, bd = Infinity;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const a = buckets.get((gx + ox) * 8192 + (gy + oy)); if (!a) continue;
      for (const i of a) {
        const dx = (M.x[i] - c.cx) - px, dy = (M.y[i] - c.cy) - py;
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
    }
    if (best < 0) continue;
    mat[v * SURF_N + u] = M.mat[best]; T[v * SURF_N + u] = M.T[best];
  }
  /* fill any gap by nearest neighbour that did land */
  for (let pass = 0; pass < 3; pass++) {
    let filled = 0;
    for (let v = 0; v < SURF_N; v++) for (let u = 0; u < SURF_N; u++) {
      const k = v * SURF_N + u;
      if (mat[k] !== 255) continue;
      const nx = (u + 0.5) / SURF_N * 2 - 1, ny = (v + 0.5) / SURF_N * 2 - 1;
      if (nx * nx + ny * ny > 1) continue;
      for (const [du, dv] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const uu = u + du, vv = v + dv;
        if (uu < 0 || vv < 0 || uu >= SURF_N || vv >= SURF_N) continue;
        const kk = vv * SURF_N + uu;
        if (mat[kk] !== 255) { mat[k] = mat[kk]; T[k] = T[kk]; filled++; break; }
      }
    }
    if (!filled) break;
  }
  return { n: SURF_N, mat, T };
}

/* ---- a body swallowing a mote ------------------------------------------ *
 *  Take its mass AND its motion.  Taking the mass and leaving the motion
 *  behind is the first of the four places momentum historically leaked.    *
 * ---------------------------------------------------------------------- */
function absorbMotes() {
  const M = Motes;
  const bs = W.bodies;
  if (!bs.length) return;
  for (let i = M.count - 1; i >= 0; i--) {
    if (M.ghost[i]) {
      if (M.age[i] > 0.0) { /* ghosts are removed by their fade timer in tick() */ }
      continue;
    }
    for (let k = 0; k < bs.length; k++) {
      const b = bs[k];
      const dx = M.x[i] - b.x, dy = M.y[i] - b.y;
      if (dx * dx + dy * dy > b.radius * b.radius) continue;
      const m = M.m[i], Mb = b.mass, tot = Mb + m;
      if (tot <= 0) break;
      const rvx = M.vx[i] - b.vx, rvy = M.vy[i] - b.vy;
      /* exact: momentum and centre of mass both carry over */
      b.x = (b.x * Mb + M.x[i] * m) / tot;
      b.y = (b.y * Mb + M.y[i] * m) / tot;
      b.vx = (b.vx * Mb + M.vx[i] * m) / tot;
      b.vy = (b.vy * Mb + M.vy[i] * m) / tot;
      /* it landed on the outside, so that is the shell it joins */
      const sh = b.shells[b.shells.length - 1];
      const shM = compTotal(sh.comp);
      const kinetic = 0.5 * (Mb * m / tot) * (rvx * rvx + rvy * rvy) * SI.vel * SI.vel;
      sh.comp[M.mat[i]] += m;
      const cpS = 1000;
      sh.T = addHeat(dominantMat(sh.comp), (sh.T * shM + M.T[i] * m) / (shM + m),
                     kinetic / SI.mass(shM + m));
      b.refresh(); b.spriteKey = '';
      M.remove(i);
      break;
    }
  }
}

function cullMotes(dt) {
  const M = Motes;
  for (let i = M.count - 1; i >= 0; i--) {
    if (M.ghost[i]) {
      M.age[i] += dt;
      if (M.age[i] > 0.35 * Math.max(W.rate, 1e-6)) M.remove(i);
      continue;
    }
    if (Math.abs(M.x[i]) > SCENE_BOUND || Math.abs(M.y[i]) > SCENE_BOUND) {
      escapedMass[M.mat[i]] += M.m[i];        // gone from the view, not from the books
      M.remove(i);
    }
  }
}

/* ====================================================================== *
 *  6. COLLISIONS                                                         *
 * ---------------------------------------------------------------------- *
 *  Two worlds meeting is never resolved in one frame, however gently they
 *  arrive.  There is no merge instruction anywhere in this file that fires
 *  on contact.
 *
 *  Both measurements are taken off the APPROACH, not off the overlap: the
 *  overlap is nearly zero at the instant they first touch and tells you
 *  nothing.  Everything below runs in SI, restored from display units, so
 *  the two admitted exaggerations (mass lifted 20x, size lifted 80x) do
 *  not leak into the energetics.
 * ====================================================================== */

/* specific gravitational binding energy of a sphere, J/kg */
function bindSpecific(massSim, radiusDisplay) {
  const M = SI.mass(massSim), R = SI.radius(radiusDisplay);
  return R > 0 ? 3 * K.SI_G * M / (5 * R) : 0;
}
function bindTotal(massSim, radiusDisplay) {
  const M = SI.mass(massSim), R = SI.radius(radiusDisplay);
  return R > 0 ? 3 * K.SI_G * M * M / (5 * R) : 0;
}

/* Leinhardt & Stewart's catastrophic disruption threshold in the gravity
 * regime, c* = 5 for rock.  This is NOT the binding energy: taking a body
 * apart costs about three times what holding it together is worth, because
 * most of what you put in comes back out as heat rather than as escape.   */
function QstarRD(massSim) {
  const M = SI.mass(massSim);
  if (M <= 0) return Infinity;
  const rho1 = 1000;
  const Rc1 = Math.cbrt(3 * M / (4 * Math.PI * rho1));
  return 5 * 0.8 * Math.PI * rho1 * K.SI_G * Rc1 * Rc1;
}

/* mass-weighted specific energy needed to bring a composition to the melt */
function meltSpecific(comp) {
  const M = compTotal(comp); if (M <= 0) return Infinity;
  let s = 0, w = 0;
  for (let mt = 0; mt < NMAT; mt++) {
    if (!isFinite(MATS[mt].qMelt)) continue;
    s += comp[mt] * MATS[mt].qMelt; w += comp[mt];
  }
  return w > 0 ? s / w : Infinity;
}

function measureImpact(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
  const v = Math.hypot(dvx, dvy);
  const rs = a.radius + b.radius;

  /* impact parameter: how far the line one is travelling along misses the
   * other's centre by, as a fraction of the sum of radii.                 */
  let bp = 1;
  if (v > 1e-12) bp = clamp(Math.abs(dx * dvy - dy * dvx) / (v * rs), 0, 1);

  const Mtot = a.mass + b.mass;
  const mu = a.mass * b.mass / Mtot;
  const Qkin = 0.5 * mu * v * v / Mtot * SI.vel * SI.vel;      // J/kg

  /* §4.1 puts a floor under Q: assembling one body out of two releases
   * gravitational energy whether they were moving beforehand or not.
   * That is true, and adding it here as a term is wrong, because the
   * motes then release it a SECOND time when they fall together and their
   * contacts dissipate the fall.  The pieces a collision throws are the
   * blast; the heat an assembly releases is the fall.  Counting both put
   * a merged pair of Earths at 24,000 K before anything had moved.
   * It is reported so a caller can see it, and it is not delivered.      */
  const comb = zeroComp(); compAdd(comb, a.comp); compAdd(comb, b.comp);
  const Rcomb = radiusOf(comb);
  const dE = bindTotal(Mtot, Rcomb) - bindTotal(a.mass, a.radius) - bindTotal(b.mass, b.radius);
  const Qgrav = Math.max(0, dE) / SI.mass(Mtot);

  return { b: bp, v, Qkin, Qgrav, Q: Qkin, Mtot, mu,
           Qstar: QstarRD(Mtot), ratio: Math.min(a.mass, b.mass) / Math.max(a.mass, b.mass) };
}

/* ---- envelope stripping precedes everything ---------------------------- *
 *  H/He is bound by almost nothing.  Any impact energetic enough to matter
 *  removes some fraction of both envelopes before it touches the rock, and
 *  that fraction leaves at the speed the envelope had.  This is the
 *  mechanism that turns giants into cores and it needs no other code path. *
 * ---------------------------------------------------------------------- */
function stripEnvelope(b, Q) {
  const env = b.shells[b.shells.length - 1];
  if (!env) return 0;
  const hh = env.comp[MAT.HHe];
  if (hh <= 0) return 0;
  /* an envelope sits at the surface, so what holds it is GM/R per kg */
  const Qenv = K.SI_G * SI.mass(b.mass) / Math.max(SI.radius(b.radius), 1);
  const frac = 1 - Math.exp(-Q / Math.max(Qenv, 1));
  const lost = hh * frac;
  if (lost <= 0) return 0;
  env.comp[MAT.HHe] -= lost;
  const vesc = b.escapeSpeed();
  const n = clamp(Math.round(60 * frac) + 8, 8, 400);
  const each = lost / n;
  const rM = b.radius * Math.sqrt(0.85 / n);
  let sx = 0, sy = 0;
  const vs = [];
  for (let i = 0; i < n; i++) {
    const th = TAU * (i + rnd()) / n;
    const s = vesc * (1.05 + 0.5 * rnd());
    vs.push([Math.cos(th) * s, Math.sin(th) * s, th]);
    sx += Math.cos(th) * s; sy += Math.sin(th) * s;
  }
  sx /= n; sy /= n;                       // net removed: the shell leaves, it is not pushed
  for (let i = 0; i < n; i++) {
    const [ux, uy, th] = vs[i];
    Motes.spawn(b.x + Math.cos(th) * b.radius, b.y + Math.sin(th) * b.radius,
                b.vx + ux - sx, b.vy + uy - sy, each, MAT.HHe, env.T, rM);
  }
  if (compTotal(env.comp) <= 0) b.shells.pop();
  b.refresh(); b.spriteKey = '';
  return lost;
}

function retireBody(b) {
  const k = W.bodies.indexOf(b);
  if (k >= 0) W.bodies.splice(k, 1);
  if (b.sprite) spriteGhosts.push({ img: b.sprite, x: b.x, y: b.y, vx: b.vx, vy: b.vy,
                                    r: b.radius, life: 0 });
  if (UI.selected === b) UI.select(null);
  if (UI.follow === b) UI.follow = null;
}

/* how the delivered energy is shared out over the stack: outer shells take
 * more of it.  Cores are deep and dense and mostly survive as cores;
 * mantles splash; envelopes are already gone.                             */
function shellHeat(body, Q) {
  const n = body.shells.length, out = new Float64Array(n);
  if (!n) return out;
  let wsum = 0; const w = new Float64Array(n);
  for (let k = 0; k < n; k++) {
    const rMid = (k === 0 ? 0 : body.shellR[k - 1] + body.shellR[k]) / (k === 0 ? 1 : 2) || body.shellR[0] / 2;
    w[k] = Math.pow(clamp(rMid / body.radius, 0.05, 1), 1.5);
    wsum += w[k] * compTotal(body.shells[k].comp);
  }
  if (wsum <= 0) return out;
  const scale = Q * SI.mass(body.mass) / wsum;      // total joules, shared by depth
  for (let k = 0; k < n; k++) {
    const mk = compTotal(body.shells[k].comp);
    if (mk <= 0) continue;
    out[k] = scale * w[k] * mk / SI.mass(mk);      // joules per kilogram
  }
  return out;
}
function dominantMat(c) { let b = 0; for (let i = 1; i < NMAT; i++) if (c[i] > c[b]) b = i; return b; }

function resolveCollisions() {
  const bs = W.bodies;
  for (let i = 0; i < bs.length; i++) {
    for (let j = i + 1; j < bs.length; j++) {
      const a = bs[i], b = bs[j];
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const rs = a.radius + b.radius;
      if (dx * dx + dy * dy > rs * rs) continue;

      const im = measureImpact(a, b);
      const big = a.mass >= b.mass ? a : b, small = big === a ? b : a;

      stripEnvelope(a, im.Q); stripEnvelope(b, im.Q);
      if (a.mass <= 0 || b.mass <= 0) { if (a.mass <= 0) retireBody(a); if (b.mass <= 0) retireBody(b); return; }

      /* --- accretion: it is caught, not mixed ------------------------- */
      if (im.ratio < 0.04 && im.Q < 0.08 * im.Qstar) {
        accrete(big, small, im);
        return;
      }
      /* --- hit-and-run: the bodies clip ------------------------------- */
      if (im.b > 0.6) {
        hitAndRun(a, b, im);
        return;
      }
      /* --- merging through a melt: everything else -------------------- */
      meltMerge(a, b, im);
      return;
    }
  }
}

function accrete(big, small, im) {
  const sh = big.shells[big.shells.length - 1];
  const shM = compTotal(sh.comp);
  const joules = im.Q * SI.mass(im.Mtot);
  const Mb = big.mass, m = small.mass, tot = Mb + m;
  big.x = (big.x * Mb + small.x * m) / tot;
  big.y = (big.y * Mb + small.y * m) / tot;
  big.vx = (big.vx * Mb + small.vx * m) / tot;
  big.vy = (big.vy * Mb + small.vy * m) / tot;
  compAdd(sh.comp, small.comp);
  const newM = shM + m;
  sh.T = addHeat(dominantMat(sh.comp), (sh.T * shM + small.meanT() * m) / newM,
                 joules / SI.mass(newM));
  big.refresh(); big.spriteKey = '';
  W.events.push({ kind: 'accrete', id: big.id, ate: small.id, t: W.t });
  retireBody(small);
}

/* the sprite pixels that would be inside the other body at closest
 * approach are scraped off both, each carrying the material of the shell
 * it was scraped from, which for a grazing hit is the envelope and the
 * shell and never the core.                                               */
function hitAndRun(a, b, im) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy) || 1e-9;
  const over = clamp((a.radius + b.radius - d) / Math.min(a.radius, b.radius), 0, 1);
  const scraped = [];
  let px = 0, py = 0, pm = 0;

  for (const [o, other] of [[a, b], [b, a]]) {
    const frac = clamp(over * 0.5 * (other.mass / (o.mass + other.mass)) * 2, 0, 0.6);
    if (frac <= 1e-6) { scraped.push(null); continue; }
    const heat = shellHeat(o, im.Q);
    const ids = scrapeOuter(o, frac, heat);
    for (const i of ids) { px += Motes.m[i] * Motes.vx[i]; py += Motes.m[i] * Motes.vy[i]; pm += Motes.m[i]; }
    scraped.push(ids);
  }
  if (pm > 0) {
    /* what was torn loose off both bodies mixes; total momentum is
     * unchanged because the mixed velocity is the mass-weighted one.      */
    const ux = px / pm, uy = py / pm;
    for (const ids of scraped) {
      if (!ids) continue;
      for (const i of ids) { Motes.vx[i] = lerp(Motes.vx[i], ux, 0.55); Motes.vy[i] = lerp(Motes.vy[i], uy, 0.55); }
    }
  }
  /* the surviving parts also touch: an equal and opposite impulse pair */
  const nx = dx / d, ny = dy / d;
  const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (vn < 0) {
    const mu = a.mass * b.mass / (a.mass + b.mass);
    const jn = -(1 + 0.25) * vn * mu * over;
    a.vx -= jn * nx / a.mass; a.vy -= jn * ny / a.mass;
    b.vx += jn * nx / b.mass; b.vy += jn * ny / b.mass;
  }
  a.hitCool = b.hitCool = W.t + 0.4;
  W.events.push({ kind: 'graze', a: a.id, b: b.id, bParam: im.b, t: W.t });
}

/* take mass off the OUTSIDE of a stack, shell by shell from the top */
function scrapeOuter(body, frac, heat) {
  let want = body.mass * frac;
  const ids = [];
  const R = body.radius;
  for (let k = body.shells.length - 1; k >= 0 && want > 1e-15; k--) {
    const sh = body.shells[k], shM = compTotal(sh.comp);
    if (shM <= 0) continue;
    const take = Math.min(shM, want); want -= take;
    const f = take / shM;
    const n = clamp(Math.round(140 * f) + 6, 6, 500);
    const rM = R * Math.sqrt(0.85 / (n * 3));
    const inner = k === 0 ? 0 : body.shellR[k - 1], outer = body.shellR[k];
    const dq = heat ? heat[k] || 0 : 0;
    for (let mt = 0; mt < NMAT; mt++) {
      const mm = sh.comp[mt] * f;
      if (mm <= 0) continue;
      const cnt = Math.max(1, Math.round(n * (sh.comp[mt] / shM)));
      const each = mm / cnt;
      for (let q = 0; q < cnt; q++) {
        const th = TAU * rnd(), rr = lerp(inner, outer, rnd());
        const id = Motes.spawn(body.x + Math.cos(th) * rr, body.y + Math.sin(th) * rr,
                               body.vx, body.vy, each, mt, addHeat(mt, sh.T, dq), rM);
        if (id >= 0) ids.push(id);
      }
      sh.comp[mt] -= mm;
    }
  }
  for (let k = body.shells.length - 1; k >= 0; k--)
    if (compTotal(body.shells[k].comp) <= 1e-18) body.shells.splice(k, 1);
  if (!body.shells.length) { retireBody(body); return ids; }
  body.refresh(); body.spriteKey = '';
  return ids;
}

/* both bodies go liquid: every pixel of both, molten, still carrying the
 * velocity it came in with and its own material.  From there it is only
 * motes.  Nothing decides what comes out; §5 does.                        */
function meltMerge(a, b, im) {
  /* No heat is deposited here.  The motes keep the velocity they came in
   * with, so the approach energy is still in the simulation, and the
   * contact pass turns it into heat as the two clouds drive through each
   * other.  Depositing it here as well is the same energy twice, which is
   * §6.1's fourth leak wearing a different hat: the pieces a collision
   * throws ARE the blast.                                                 */
  shatterBody(a);
  shatterBody(b);
  W.events.push({ kind: 'melt', a: a.id, b: b.id, Q: im.Q, Qstar: im.Qstar,
                  bParam: im.b, t: W.t });
  retireBody(a); retireBody(b);
}

/* ====================================================================== *
 *  7. STELLAR EVOLUTION                                                  *
 * ---------------------------------------------------------------------- *
 *  Not built yet (design step 7).  What is here is the part the rest of
 *  the file already depends on: a fusing body carries a DEGENERATE core
 *  mass tracked separately from its total, because Chandrasekhar is a
 *  limit on a core and not on a star.  A 20 solar-mass star leaves a 1.5
 *  solar-mass neutron star; it does not collapse because it weighs 20.
 *  Collapse is gated on two conditions together: the core has fused
 *  through to something that cannot burn, AND its degenerate mass passes
 *  the limit.
 * ====================================================================== */
const CHANDRASEKHAR = 1.44;                 // solar masses, on the CORE
const NS_MAX = 2.6;                         // Tolman-Oppenheimer-Volkoff, roughly
function solarMasses(simMass) { return SI.mass(simMass) / K.SI_MSUN; }
function coreCanCollapse(b) {
  return b.fusing && b.coreFuel <= 0 && solarMasses(b.coreMass) >= CHANDRASEKHAR;
}

/* ====================================================================== *
 *  8. RENDERING                                                          *
 * ---------------------------------------------------------------------- *
 *  Everything is drawn into a buffer several times smaller than the window
 *  and blown up with image-rendering: pixelated.  That is the pixel art,
 *  and it is also why a few hundred thousand motes are affordable.
 * ====================================================================== */
const sky = document.getElementById('sky');
const skyCtx = sky.getContext('2d', { alpha: false });
const PIXEL = 4;
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d', { alpha: false, willReadFrequently: true });
let BW = 0, BH = 0, frame = null, fdata = null, dens = null;

const cam = { x: 0, y: 0, scale: 1, target: 1 };

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  sky.width = Math.max(1, Math.floor(w * devicePixelRatio / PIXEL) * PIXEL / devicePixelRatio * devicePixelRatio);
  sky.width = Math.max(1, Math.round(w * devicePixelRatio));
  sky.height = Math.max(1, Math.round(h * devicePixelRatio));
  sky.style.width = w + 'px'; sky.style.height = h + 'px';
  BW = Math.max(64, Math.ceil(sky.width / PIXEL));
  BH = Math.max(64, Math.ceil(sky.height / PIXEL));
  buf.width = BW; buf.height = BH;
  frame = bctx.createImageData(BW, BH);
  fdata = frame.data;
  dens = new Uint16Array(BW * BH);
  skyCtx.imageSmoothingEnabled = false;
  bctx.imageSmoothingEnabled = false;
  for (const b of W.bodies) b.spriteKey = '';
}
addEventListener('resize', resize);

const w2sx = wx => (wx - cam.x) * cam.scale + BW / 2;
const w2sy = wy => (wy - cam.y) * cam.scale + BH / 2;
const s2wx = sx => (sx - BW / 2) / cam.scale + cam.x;
const s2wy = sy => (sy - BH / 2) / cam.scale + cam.y;
/* client pixels -> buffer pixels */
const c2bx = cx => cx * devicePixelRatio / PIXEL;
const c2by = cy => cy * devicePixelRatio / PIXEL;

/* ---- value noise ------------------------------------------------------ */
function hash2(x, y, s) {
  let h = x * 374761393 + y * 668265263 + s * 2147483647;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s);
  const c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s, oct) {
  let v = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < (oct || 4); i++) { v += amp * vnoise(x * f, y * f, s + i * 71); norm += amp; amp *= 0.5; f *= 2.07; }
  return v / norm;
}

/* ---- sprites are generated, not drawn --------------------------------- *
 *  Value noise shaded against a sphere normal, coloured from a material-
 *  and-temperature ramp.  A body that settled out of a melt carries a
 *  surface map projected from its own motes (§5.3); the detail below goes
 *  ON TOP of that map rather than instead of it.                          *
 * ---------------------------------------------------------------------- */
function lightDir(b) {
  let best = null, score = 0;
  for (const o of W.bodies) {
    if (o === b) continue;
    const l = o.fusing ? (o.lum || 1) : (o.surfaceT() > 1400 ? 0.03 : 0);
    if (l <= 0) continue;
    const d2 = (o.x - b.x) ** 2 + (o.y - b.y) ** 2 + 1e-9;
    const s = l / d2;
    if (s > score) { score = s; best = o; }
  }
  if (!best) return [0.55, -0.45, 0.70];
  const dx = best.x - b.x, dy = best.y - b.y, d = Math.hypot(dx, dy) || 1;
  return [dx / d, dy / d, 0.35];
}

function pickShellMat(comp, u) {
  const t = compTotal(comp); if (t <= 0) return MAT.Si;
  let acc = 0;
  for (let mt = 0; mt < NMAT; mt++) { acc += comp[mt] / t; if (u <= acc) return mt; }
  return dominantMat(comp);
}

function buildSprite(b, Rpx) {
  const S = Rpx * 2 + 2;
  const img = bctx.createImageData(S, S);
  const d = img.data;
  const L = lightDir(b);
  const Lm = Math.hypot(L[0], L[1], L[2]) || 1;
  const lx = L[0] / Lm, ly = L[1] / Lm, lz = L[2] / Lm;
  const outer = b.shells[b.shells.length - 1] || { comp: zeroComp(), T: 0 };
  const gas = b.frac(MAT.HHe) > 0.15;
  const star = b.fusing;
  const Tsurf = outer.T;
  const seed = b.seed;
  const sm = b.surfaceMap;
  const rough = b.mass < DIFF_MASS * 40;         // small bodies keep their craters
  const ang = b.angle;
  const ca = Math.cos(ang), sa = Math.sin(ang);

  for (let py = 0; py < S; py++) {
    const ny = (py + 0.5 - S / 2) / Rpx;
    for (let px = 0; px < S; px++) {
      const nx = (px + 0.5 - S / 2) / Rpx;
      const rr = nx * nx + ny * ny;
      const k = (py * S + px) * 4;
      if (rr > 1) { d[k + 3] = 0; continue; }
      const nz = Math.sqrt(1 - rr);

      /* rotate the sample point so the surface turns with the body */
      const sx = nx * ca + nz * sa, sz = -nx * sa + nz * ca;
      const lon = Math.atan2(sx, sz), lat = Math.asin(clamp(ny, -1, 1));

      let mt, T;
      if (sm) {
        const u = clamp(Math.floor((nx * 0.5 + 0.5) * sm.n), 0, sm.n - 1);
        const v = clamp(Math.floor((ny * 0.5 + 0.5) * sm.n), 0, sm.n - 1);
        const q = sm.mat[v * sm.n + u];
        mt = q === 255 ? dominantMat(outer.comp) : q;
        T = sm.T[v * sm.n + u] || Tsurf;
      } else {
        T = Tsurf;
        mt = pickShellMat(outer.comp, fbm(lon * 1.9 + 40, lat * 2.4, seed, 4));
      }

      /* detail on top */
      let tex;
      if (star) {
        tex = 0.86 + 0.28 * fbm(lon * 7 + W.t * 0.0, lat * 9, seed, 3);
      } else if (gas) {
        const warp = fbm(lon * 1.4, lat * 3.2, seed + 13, 3) - 0.5;
        tex = 0.78 + 0.42 * (0.5 + 0.5 * Math.sin((lat * 9 + warp * 3.4) * 1.7 + seed % 6));
        tex *= 0.9 + 0.2 * fbm(lon * 5, lat * 5, seed + 91, 2);
      } else {
        tex = 0.68 + 0.62 * fbm(lon * 2.6 + 11, lat * 3.1, seed, 4);
        if (rough) {
          const c = fbm(lon * 7.5, lat * 8.5, seed + 7, 2);
          tex *= c > 0.62 ? 0.72 : (c < 0.34 ? 1.16 : 1);
        }
      }

      let shade;
      if (star) {
        shade = 1 - 0.42 * Math.pow(clamp(rr, 0, 1), 1.6);        // limb darkening
      } else {
        const dot = nx * lx + ny * ly + nz * lz;
        shade = clamp(dot, 0, 1) * 0.94 + 0.08;
      }
      const col = matColour(mt, T, tex * shade);
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
    }
  }
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  cv.getContext('2d').putImageData(img, 0, 0);
  return cv;
}

function spriteFor(b) {
  const Rpx = Math.max(K.MIN_PX, Math.round(b.radius * cam.scale));
  const key = Rpx + ':' + (Math.round(b.angle * 12) % 76) + ':' + (b.surfaceMap ? 1 : 0) +
              ':' + Math.round(b.surfaceT() / 60);
  if (b.spriteKey !== key || !b.sprite) {
    b.sprite = buildSprite(b, Math.min(Rpx, 180));
    b.spriteKey = key;
    b.spriteR = Math.min(Rpx, 180);
  }
  return b.sprite;
}

/* ---- the frame --------------------------------------------------------- */
const STARS = (() => {
  const a = [];
  srand(20260909);
  for (let i = 0; i < 900; i++) a.push({ x: rnd(), y: rnd(), z: 0.15 + rnd() * 0.5, b: 40 + rnd() * 150 });
  return a;
})();

function drawStars() {
  const px = cam.x, py = cam.y;
  for (let i = 0; i < STARS.length; i++) {
    const s = STARS[i];
    let sx = (s.x * BW * 3 - px * s.z * 0.02) % (BW * 3); if (sx < 0) sx += BW * 3;
    let sy = (s.y * BH * 3 - py * s.z * 0.02) % (BH * 3); if (sy < 0) sy += BH * 3;
    sx %= BW; sy %= BH;
    const k = ((sy | 0) * BW + (sx | 0)) * 4;
    fdata[k] = s.b * 0.8; fdata[k + 1] = s.b * 0.82; fdata[k + 2] = s.b; fdata[k + 3] = 255;
  }
}

/* Gas is a density field, not a heap of translucent squares.  Every mote
 * lays down optical depth and what you see is how much is stacked along
 * the line of sight.  Opacity is 1 - exp(-kd), which is Beer-Lambert, and
 * the depth is then banded into a handful of steps: rendered continuously
 * a cloud comes out as soft round blobs, which is the one thing this is
 * not allowed to look like.                                               */
const BANDS = 6;
let moteAcc = null;
function drawMotes() {
  const M = Motes, n = M.count;
  if (!n) return;
  dens.fill(0);
  if (!moteAcc || moteAcc.length !== BW * BH * 3) moteAcc = new Uint8ClampedArray(BW * BH * 3);
  else moteAcc.fill(0);
  const acc = moteAcc;                              // saturating, so additive is free
  let lo = BW, hi = 0, top = BH, bot = 0, any = false;

  for (let i = 0; i < n; i++) {
    const sx = w2sx(M.x[i]) | 0, sy = w2sy(M.y[i]) | 0;
    if (sx < 0 || sy < 0 || sx >= BW || sy >= BH) continue;
    const ghost = M.ghost[i];
    const col = matColour(M.mat[i], M.T[i], ghost ? 0.5 : 1);
    const rp = M.r[i] * cam.scale;
    const p = (sy * BW + sx);
    const q = p * 3;
    acc[q] += col[0]; acc[q + 1] += col[1]; acc[q + 2] += col[2];
    dens[p] += ghost ? 1 : 3;
    if (rp > 1.1) {           // a soft puff, so a thick cloud reads as thick
      const half = [[1,0],[-1,0],[0,1],[0,-1]];
      for (let e = 0; e < 4; e++) {
        const ax = sx + half[e][0], ay = sy + half[e][1];
        if (ax < 0 || ay < 0 || ax >= BW || ay >= BH) continue;
        const pp = ay * BW + ax, qq = pp * 3;
        acc[qq] += col[0] >> 1; acc[qq + 1] += col[1] >> 1; acc[qq + 2] += col[2] >> 1;
        dens[pp] += 2;
      }
    }
    any = true;
    if (sx < lo) lo = sx; if (sx > hi) hi = sx;
    if (sy < top) top = sy; if (sy > bot) bot = sy;
  }
  if (!any) return;
  lo = Math.max(0, lo - 2); hi = Math.min(BW - 1, hi + 2);
  top = Math.max(0, top - 2); bot = Math.min(BH - 1, bot + 2);

  for (let y = top; y <= bot; y++) {
    for (let x = lo; x <= hi; x++) {
      const p = y * BW + x, dvi = dens[p];
      if (!dvi) continue;
      const tau = 1 - Math.exp(-0.34 * dvi);
      const a = Math.ceil(tau * BANDS) / BANDS;        // banded, so it reads as pixel art
      const q = p * 3, k = p * 4;
      fdata[k]     = lerp(fdata[k],     acc[q],     a);
      fdata[k + 1] = lerp(fdata[k + 1], acc[q + 1], a);
      fdata[k + 2] = lerp(fdata[k + 2], acc[q + 2], a);
      fdata[k + 3] = 255;
    }
  }
}

function drawFrame() {
  /* space */
  for (let i = 0; i < fdata.length; i += 4) { fdata[i] = 6; fdata[i + 1] = 4; fdata[i + 2] = 13; fdata[i + 3] = 255; }
  drawStars();
  drawMotes();
  bctx.putImageData(frame, 0, 0);

  /* trails: sampled by distance travelled, so they look the same at every
   * clock setting instead of vanishing when you slow down.                */
  if (UI.trails) {
    bctx.lineWidth = 1;
    for (const b of W.bodies) {
      if (b.trail.length < 2) continue;
      bctx.beginPath();
      for (let i = 0; i < b.trail.length; i++) {
        const p = b.trail[i];
        const x = w2sx(p[0]), y = w2sy(p[1]);
        i ? bctx.lineTo(x, y) : bctx.moveTo(x, y);
      }
      bctx.strokeStyle = 'rgba(150,130,220,.30)';
      bctx.stroke();
    }
  }

  if (UI.orbits) drawOrbits();

  /* a world turning to rubble leaves its own sprite behind for about a
   * third of a second, drifting with what it became.  Nothing pops.       */
  for (let i = spriteGhosts.length - 1; i >= 0; i--) {
    const g = spriteGhosts[i];
    const a = 1 - g.life / 0.33;
    if (a <= 0) { spriteGhosts.splice(i, 1); continue; }
    const R = Math.max(K.MIN_PX, g.r * cam.scale);
    bctx.globalAlpha = a * a;
    bctx.drawImage(g.img, w2sx(g.x) - R, w2sy(g.y) - R, R * 2, R * 2);
    bctx.globalAlpha = 1;
  }

  for (const b of W.bodies) {
    const R = Math.max(K.MIN_PX, b.radius * cam.scale);
    const x = w2sx(b.x), y = w2sy(b.y);
    if (x < -R - 4 || y < -R - 4 || x > BW + R + 4 || y > BH + R + 4) continue;
    const sp = spriteFor(b);
    bctx.drawImage(sp, Math.round(x - R), Math.round(y - R), Math.round(R * 2), Math.round(R * 2));
    if (UI.selected === b) {
      bctx.strokeStyle = 'rgba(187,141,255,.85)';
      bctx.strokeRect(Math.round(x - R) - 2.5, Math.round(y - R) - 2.5, Math.round(R * 2) + 5, Math.round(R * 2) + 5);
    }
  }

  if (UI.aim) drawPrediction();
  skyCtx.imageSmoothingEnabled = false;
  skyCtx.drawImage(buf, 0, 0, sky.width, sky.height);
}

/* Orbit outlines come out of the state vector, not out of a fit to the
 * trail.  Draw nothing where there is no orbit: escaping, near-radial, a
 * periapsis underneath the host's own surface, or a body heavier than the
 * thing it is supposedly going round all disqualify it, because each is a
 * case where an ellipse would be a claim about to break.                  */
function drawOrbits() {
  for (const b of W.bodies) {
    const host = hostOf(b);
    if (!host) continue;
    const o = orbitOf(b, host);
    if (!o || !o.bound) continue;
    if (o.e > 0.985) continue;
    if (o.peri < host.radius) continue;
    if (b.mass > host.mass) continue;
    const a = o.a, e = o.e, bb = a * Math.sqrt(1 - e * e);
    const cx = host.x - a * e * Math.cos(o.argp), cy = host.y - a * e * Math.sin(o.argp);
    if (a * cam.scale > BW * 40) continue;
    bctx.save();
    bctx.translate(w2sx(cx), w2sy(cy));
    bctx.rotate(o.argp);
    bctx.scale(a * cam.scale, bb * cam.scale);
    bctx.beginPath(); bctx.arc(0, 0, 1, 0, TAU); bctx.restore();
    bctx.lineWidth = 1;
    bctx.strokeStyle = UI.selected === b ? 'rgba(187,141,255,.75)' : 'rgba(140,120,190,.28)';
    bctx.stroke();
  }
}

/* While the player aims, a massless probe is integrated through the frozen
 * field a few hundred steps ahead and drawn.  It is the difference between
 * a gravity toy and a gravity guessing game.                              */
function drawPrediction() {
  const a = UI.aim;
  let x = a.x, y = a.y, vx = a.vx, vy = a.vy;
  const src = topSources(8);
  const dt = 0.35 / Math.max(1, Math.sqrt(cam.scale));
  bctx.beginPath();
  bctx.moveTo(w2sx(x), w2sy(y));
  for (let s = 0; s < 420; s++) {
    let ax = 0, ay = 0;
    for (const b of src) {
      const dx = b.x - x, dy = b.y - y;
      const r2 = dx * dx + dy * dy + K.SOFT2;
      const inv = b.mass / (r2 * Math.sqrt(r2));
      ax += dx * inv; ay += dy * inv;
    }
    vx += ax * dt; vy += ay * dt; x += vx * dt; y += vy * dt;
    if (s % 2 === 0) bctx.lineTo(w2sx(x), w2sy(y));
  }
  bctx.setLineDash([3, 3]);
  bctx.strokeStyle = 'rgba(187,141,255,.7)';
  bctx.lineWidth = 1;
  bctx.stroke();
  bctx.setLineDash([]);
}

function bodyFromRoster(entry, x, y, vx, vy) {
  const shells = makeStack(entry.m, entry.f, { surface: entry.T, mix: entry.T });
  const b = new Body({
    x, y, vx, vy, shells,
    rOverride: entry.R || 0,
    inflated: !!entry.inflated,
    fusing: !!entry.fusing,
    stellarClass: entry.stellarClass || null,
    remnant: entry.remnant || null,
    coreMass: entry.core || 0,
    coreFuel: entry.fuel === undefined ? 1 : entry.fuel,
    spin: entry.spin || 0,
    name: entry.name,
  });
  if (entry.fusing || entry.remnant) b.lum = Math.pow(solarMasses(b.mass), 3.5);
  return b;
}

/* ====================================================================== *
 *  10. THE INTERFACE                                                     *
 * ---------------------------------------------------------------------- *
 *  The sky is the interface.  Nothing permanently covers the middle, the
 *  bar is docked rather than floating so its edge cannot be overshot, and
 *  the readouts say what is true rather than what is set.
 * ====================================================================== */
const $ = s => document.querySelector(s);
const UI = {
  picked: null,          // roster entry, or null.  The picker CAN hold nothing.
  selected: null,
  follow: null,
  drag: false, trails: true, orbits: true, autoOrbit: true,
  aim: null, grabbed: null, panning: null,
  rateSlider: 420,
  select(b) {
    this.selected = b;
    if (!b) { $('#insp').classList.remove('open'); $('#leader').classList.remove('open'); }
    else { $('#insp').classList.add('open'); $('#leader').classList.add('open'); }
  },
};

/* ---- the clock -------------------------------------------------------- *
 *  A multiplier is a number about the simulation; what a year costs is the
 *  thing worth knowing.  Both are shown, with the derived one large, and
 *  the unit steps down as the clock slows because 0.003 yr/s is a true
 *  statement nobody can read.                                             *
 * ---------------------------------------------------------------------- */
function rateMultiplier(v) {
  const s = v / 1000;
  if (s <= 0.75) return 1000 * Math.pow(s / 0.75, 3);
  return 1000 * Math.pow(10, (s - 0.75) / 0.25);
}
function baseRate() { return YEAR_UNITS / 10000; }     // top of the track: about a year a second

function rateLabel(unitsPerSec) {
  const yr = unitsPerSec / YEAR_UNITS;
  const steps = [[1, 'yr'], [12, 'mo'], [365.25, 'd'], [8766, 'h'], [525960, 'min']];
  for (const [k, u] of steps) {
    const v = yr * k;
    if (v >= 0.8 || u === 'min') {
      return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + ' ' + u + '/s';
    }
  }
  return '0';
}
function applyRate() {
  const mul = rateMultiplier(UI.rateSlider);
  W.rate = baseRate() * mul;
  $('#rateBig').textContent = rateLabel(W.rate);
  $('#rateMul').textContent = (mul >= 100 ? mul.toFixed(0) : mul >= 10 ? mul.toFixed(1) : mul.toFixed(2)) + '×';
}

/* ---- the picker ------------------------------------------------------- *
 *  It must be possible for no body to be lit.  If the picker always has a
 *  selection, every press on empty sky puts a world there whether you
 *  wanted one or not, and with a tool in hand that is precisely the press
 *  you were trying to make.                                               *
 * ---------------------------------------------------------------------- */
function chipSprite(entry, size) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const c = cv.getContext('2d');
  const tmp = bodyFromRoster(entry, 0, 0, 0, 0);
  const R = Math.floor(size / 2) - 1;
  const sp = buildSprite(tmp, R);
  c.imageSmoothingEnabled = false;
  c.drawImage(sp, Math.floor(size / 2) - R, Math.floor(size / 2) - R);
  return cv;
}

function buildPicker() {
  const row = $('#picker'), jumps = $('#shelfJumps');
  row.innerHTML = ''; jumps.innerHTML = '';
  for (const shelf of SHELVES) {
    const jb = document.createElement('button');
    jb.textContent = shelf;
    jb.onclick = () => { const g = row.querySelector('[data-shelf="' + shelf + '"]');
                         if (g) row.scrollTo({ left: g.offsetLeft - row.offsetLeft - 8, behavior: 'smooth' }); };
    jumps.appendChild(jb);

    const g = document.createElement('div');
    g.className = 'group'; g.dataset.shelf = shelf;
    const gn = document.createElement('div');
    gn.className = 'gname'; gn.textContent = shelf;
    gn.onclick = jb.onclick;
    g.appendChild(gn);
    for (const e of ROSTER) {
      if (e.shelf !== shelf) continue;
      const chip = document.createElement('div');
      chip.className = 'chip'; chip.dataset.name = e.name;
      chip.appendChild(chipSprite(e, 26));
      const sp = document.createElement('span'); sp.textContent = e.name;
      chip.appendChild(sp);
      chip.onclick = () => pick(UI.picked === e ? null : e);   // tapping the lit one puts it out
      g.appendChild(chip);
    }
    row.appendChild(g);
  }
}
function pick(entry) {
  UI.picked = entry;
  for (const c of document.querySelectorAll('.chip'))
    c.classList.toggle('on', !!entry && c.dataset.name === entry.name);
  const pc = $('#placeChip');
  pc.querySelector('span').textContent = entry ? entry.name : 'nothing';
  const cv = pc.querySelector('canvas'), cx = cv.getContext('2d');
  cx.clearRect(0, 0, 16, 16);
  if (entry) { cx.imageSmoothingEnabled = false; cx.drawImage(chipSprite(entry, 16), 0, 0); }
}

/* ---- the inspector rides the body -------------------------------------- */
const MAT_CSS = ['#79767f', '#7d6a55', '#33303 8', '#c6dce8', '#d6cca8'];
MAT_CSS[2] = '#4a4652';
function fmtMass(m) {
  const e = m;                                        // sim mass IS real Earth masses
  if (e >= 300) return (SI.mass(m) / K.SI_MJUP).toFixed(2) + ' Mⱼ';
  if (e >= 0.02) return e.toFixed(e >= 10 ? 1 : 3) + ' M⊕';
  return e.toExponential(2) + ' M⊕';
}
function updateInspector() {
  const b = UI.selected;
  if (!b) return;
  if (W.bodies.indexOf(b) < 0) { UI.select(null); return; }
  const host = hostOf(b), o = host ? orbitOf(b, host) : null;
  b._ecc = o && o.bound ? o.e : 0;

  $('#inspName b').textContent = className(b, o ? { e: o.e } : null) +
    (stateWord(b) ? '  · ' + stateWord(b) : '');
  const rows = [];
  rows.push(['mass', fmtMass(b.mass)]);
  rows.push(['radius', (b.radius / RE_UNITS / K.SIZE_EXAG).toPrecision(3) + ' R⊕']);
  rows.push(['speed', Math.hypot(b.vx, b.vy).toFixed(2) + ' u/t']);
  rows.push(['surface', Math.round(b.surfaceT()) + ' K']);
  if (b.rockT() > 400) rows.push(['rock', Math.round(b.rockT()) + ' K']);
  if (host && o && o.bound) {
    rows.push(['orbits', host.name || className(host)]);
    rows.push(['period', rateLabel(o.T).replace('/s', '')]);
    rows.push(['a / e', o.a.toFixed(1) + ' / ' + o.e.toFixed(3)]);
    rows.push(['one lap', (o.T / Math.max(W.rate, 1e-9)).toFixed(1) + ' s real']);
  } else if (host) {
    rows.push(['orbits', 'escaping ' + (host.name || className(host))]);
  }
  $('#inspRows').innerHTML = rows.map(r =>
    '<div class="kv"><i>' + r[0] + '</i><b>' + r[1] + '</b></div>').join('');

  /* the composition bar is the whole material system made visible, and
   * watching it change after a collision is the point.                    */
  const bar = $('#compBar'); bar.innerHTML = '';
  const key = $('#compKey'); key.innerHTML = '';
  for (let mt = 0; mt < NMAT; mt++) {
    const f = b.frac(mt);
    if (f <= 0.0005) continue;
    const d = document.createElement('div');
    d.style.width = (f * 100) + '%'; d.style.background = MAT_CSS[mt];
    d.title = MATS[mt].full + ' ' + (f * 100).toFixed(1) + '%';
    bar.appendChild(d);
    const s = document.createElement('span');
    s.innerHTML = '<i style="background:' + MAT_CSS[mt] + '"></i>' + MATS[mt].name +
                  ' ' + (f * 100).toFixed(f > 0.1 ? 0 : 1) + '%';
    key.appendChild(s);
  }
  /* it sits near the body it describes, with a leader line, and it moves */
  const sx = w2sx(b.x) * PIXEL / devicePixelRatio, sy = w2sy(b.y) * PIXEL / devicePixelRatio;
  const R = Math.max(K.MIN_PX, b.radius * cam.scale) * PIXEL / devicePixelRatio;
  const el = $('#insp');
  const bw = el.offsetWidth || 200, bh = el.offsetHeight || 140;
  let px = sx + R + 16, py = sy - bh / 2;
  if (px + bw > innerWidth - 8) px = sx - R - 16 - bw;
  px = clamp(px, 8, innerWidth - bw - 8);
  py = clamp(py, 8, innerHeight - bh - 96);
  el.style.left = px + 'px'; el.style.top = py + 'px';
  const line = $('#leader').firstElementChild;
  $('#leader').setAttribute('viewBox', '0 0 ' + innerWidth + ' ' + innerHeight);
  $('#leader').style.width = innerWidth + 'px'; $('#leader').style.height = innerHeight + 'px';
  line.setAttribute('x1', sx); line.setAttribute('y1', sy);
  line.setAttribute('x2', px < sx ? px + bw : px); line.setAttribute('y2', py + bh / 2);
}

/* ---- pointers: touch and mouse are the same code path ------------------ */
const FLING = 0.06;      // §15.5: the clock does not run at hand speed, so a
                         // cursor's true world velocity is nonsense as an orbital one
const pointers = new Map();
let spaceHeld = false, pinch = null;

function bodyAt(bx, by) {
  const wx = s2wx(bx), wy = s2wy(by);
  let best = null, bd = Infinity;
  for (const b of W.bodies) {
    const R = Math.max(b.radius, (K.MIN_PX + 3) / cam.scale);
    const d = (b.x - wx) ** 2 + (b.y - wy) ** 2;
    if (d < R * R && d < bd) { bd = d; best = b; }
  }
  return best;
}

sky.addEventListener('pointerdown', ev => {
  sky.setPointerCapture(ev.pointerId);
  const bx = c2bx(ev.clientX), by = c2by(ev.clientY);
  pointers.set(ev.pointerId, { bx, by, x0: bx, y0: by, t0: performance.now() });

  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = { d: Math.hypot(p.bx - q.bx, p.by - q.by), scale: cam.scale,
              cx: (p.bx + q.bx) / 2, cy: (p.by + q.by) / 2,
              wx: s2wx((p.bx + q.bx) / 2), wy: s2wy((p.by + q.by) / 2) };
    UI.aim = null; UI.grabbed = null;
    return;
  }
  if (ev.button === 1 || spaceHeld) { UI.panning = { bx, by, cx: cam.x, cy: cam.y }; return; }

  const hit = bodyAt(bx, by);
  if (UI.drag && hit) {
    /* a tool press is not a selection: picking a world up leaves the
     * inspector exactly as it was.                                        */
    hit.held = true;
    UI.grabbed = { b: hit, lx: bx, ly: by, vx: 0, vy: 0, lt: performance.now() };
    UI.follow = null;
    return;
  }
  if (hit) { UI.select(UI.selected === hit ? null : hit); return; }
  if (UI.picked) { UI.aim = { x: s2wx(bx), y: s2wy(by), vx: 0, vy: 0, bx, by, moved: false }; return; }
  UI.select(null);
});

sky.addEventListener('pointermove', ev => {
  const p = pointers.get(ev.pointerId);
  const bx = c2bx(ev.clientX), by = c2by(ev.clientY);
  if (p) { p.bx = bx; p.by = by; }

  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.bx - b.bx, a.by - b.by);
    if (pinch.d > 4) setScale(pinch.scale * (d / pinch.d), (a.bx + b.bx) / 2, (a.by + b.by) / 2, pinch.wx, pinch.wy);
    return;
  }
  if (UI.panning) {
    cam.x = UI.panning.cx - (bx - UI.panning.bx) / cam.scale;
    cam.y = UI.panning.cy - (by - UI.panning.by) / cam.scale;
    UI.follow = null;
    return;
  }
  if (UI.grabbed) {
    const g = UI.grabbed, now = performance.now(), dt = Math.max(1, now - g.lt) / 1000;
    const nx = s2wx(bx), ny = s2wy(by);
    g.vx = (nx - g.b.x) / dt; g.vy = (ny - g.b.y) / dt;
    g.b.x = nx; g.b.y = ny; g.lt = now;
    return;
  }
  if (UI.aim) {
    const a = UI.aim;
    a.vx = (s2wx(a.bx) - s2wx(bx)) * FLING;
    a.vy = (s2wy(a.by) - s2wy(by)) * FLING;
    if (Math.hypot(bx - a.bx, by - a.by) > 3) a.moved = true;
  }
});

function endPointer(ev) {
  const bx = c2bx(ev.clientX), by = c2by(ev.clientY);
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  UI.panning = null;

  if (UI.grabbed) {
    const g = UI.grabbed;
    g.b.held = false;
    /* what it carries away is put on the same scale a fling is */
    const s = clamp(FLING * 6, 0, 1);
    g.b.vx = g.vx * s; g.b.vy = g.vy * s;
    UI.grabbed = null;
    return;
  }
  if (UI.aim) {
    const a = UI.aim;
    if (UI.picked) {
      if (!a.moved && UI.autoOrbit) placeInOrbit(a.x, a.y);
      else place(a.x, a.y, a.vx, a.vy);
    }
    UI.aim = null;
  }
}
sky.addEventListener('pointerup', endPointer);
sky.addEventListener('pointercancel', endPointer);

function setScale(s, bx, by, wxIn, wyIn) {
  const wx = wxIn !== undefined ? wxIn : s2wx(bx), wy = wyIn !== undefined ? wyIn : s2wy(by);
  cam.scale = clamp(s, 1e-7, 4000);
  cam.x = wx - (bx - BW / 2) / cam.scale;
  cam.y = wy - (by - BH / 2) / cam.scale;
  UI.follow = null;
}
sky.addEventListener('wheel', ev => {
  ev.preventDefault();
  const bx = c2bx(ev.clientX), by = c2by(ev.clientY);
  setScale(cam.scale * Math.pow(1.0016, -ev.deltaY), bx, by);
}, { passive: false });

function place(x, y, vx, vy) {
  if (!UI.picked) return;
  const b = bodyFromRoster(UI.picked, x, y, vx, vy);
  W.bodies.push(b);
  return b;
}
/* with Auto-orbit on, a tap drops the body straight into a circular orbit
 * about whatever dominates there, at the speed the SOFTENED force law
 * balances.                                                               */
function placeInOrbit(x, y) {
  let host = null, score = 0;
  for (const o of W.bodies) {
    const r2 = (o.x - x) ** 2 + (o.y - y) ** 2 + K.SOFT2;
    const s = o.mass / r2;
    if (s > score) { score = s; host = o; }
  }
  if (!host) return place(x, y, 0, 0);
  const dx = x - host.x, dy = y - host.y, r = Math.hypot(dx, dy) || 1e-6;
  const v = circularSpeed(host.mass, r);
  return place(x, y, host.vx - dy / r * v, host.vy + dx / r * v);
}

function setPaused(p) {

  $('#live').classList.toggle('on', !p);
}
function clearAll() {
  W.bodies.length = 0; Motes.clear(); W.clumps.length = 0;
  spriteGhosts.length = 0; escapedMass.fill(0);
  UI.select(null); UI.follow = null; W.t = 0;
}
function fitAll() {
  if (!W.bodies.length && !Motes.count) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const b of W.bodies) {
    x0 = Math.min(x0, b.x - b.radius); x1 = Math.max(x1, b.x + b.radius);
    y0 = Math.min(y0, b.y - b.radius); y1 = Math.max(y1, b.y + b.radius);
  }
  for (let i = 0; i < Motes.count; i++) {
    x0 = Math.min(x0, Motes.x[i]); x1 = Math.max(x1, Motes.x[i]);
    y0 = Math.min(y0, Motes.y[i]); y1 = Math.max(y1, Motes.y[i]);
  }
  if (!isFinite(x0)) return;
  cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2;
  cam.scale = clamp(Math.min(BW / Math.max(x1 - x0, 1e-6), BH / Math.max(y1 - y0, 1e-6)) * 0.78, 1e-7, 4000);
  UI.follow = null;
}

/* ---- the Forge --------------------------------------------------------- *
 *  Not a palette picker.  It sets the layer stack directly, and the preview
 *  name updates from §3.4 as you move it, which is the clearest possible
 *  demonstration that the naming is derived rather than stored.  Both mass
 *  and the composition mix are logarithmic where a log axis is what the
 *  range needs: one sweep covers a pebble and a supermassive black hole.
 * ---------------------------------------------------------------------- */
const forge = { logM: 0, f: [0.32, 0.68, 0, 0, 0], T: 288 };
function buildForge() {
  const host = $('#forgeBody');
  const rows = [
    ['mass', 'logM', -9, 9, 0.01],
    ['temp', 'T', 20, 30000, 10],
  ];
  let html = '';
  for (const [lbl, k, lo, hi, st] of rows)
    html += '<div class="field"><label>' + lbl + '</label><input type="range" data-k="' + k +
            '" min="' + lo + '" max="' + hi + '" step="' + st + '"><output data-o="' + k + '"></output></div>';
  for (let mt = 0; mt < NMAT; mt++)
    html += '<div class="field"><label>' + MATS[mt].name + '</label><input type="range" data-f="' + mt +
            '" min="0" max="1" step="0.01"><output data-of="' + mt + '"></output></div>';
  html += '<div class="field"><label>is</label><output data-o="cls" style="width:auto;flex:1;text-align:left;color:var(--accent)"></output></div>';
  html += '<div class="field"><label>radius</label><output data-o="rad" style="width:auto;flex:1;text-align:left"></output></div>';
  html += '<button id="forgePlace" style="width:100%;margin-top:5px">Load into the picker</button>';
  host.innerHTML = html;

    if (t.dataset.k) forge[t.dataset.k] = +t.value;

  };
  $('#forgePlace').onclick = () => { pick(forgeEntry()); toast('Forged body is in the picker'); };
}
function forgeEntry() {
  const f = {}; let tot = 0;
  for (let mt = 0; mt < NMAT; mt++) { f[MAT_NAMES[mt]] = forge.f[mt]; tot += forge.f[mt]; }
  if (tot <= 0) f.Si = 1;
  return { shelf: 'Forge', name: 'Forged', m: Math.pow(10, forge.logM), f, T: forge.T };
}
function forgeSync() {
  const host = $('#forgeBody');
  for (const el of host.querySelectorAll('[data-k]')) el.value = forge[el.dataset.k];
  for (const el of host.querySelectorAll('[data-f]')) el.value = forge.f[+el.dataset.f];
  const e = forgeEntry();
  const b = bodyFromRoster(e, 0, 0, 0, 0);
  host.querySelector('[data-o="logM"]').textContent = fmtMass(b.mass);
  host.querySelector('[data-o="T"]').textContent = forge.T + ' K';
  for (let mt = 0; mt < NMAT; mt++)
    host.querySelector('[data-of="' + mt + '"]').textContent = (b.frac(mt) * 100).toFixed(0) + '%';
  host.querySelector('[data-o="cls"]').textContent = className(b) + (stateWord(b) ? ' · ' + stateWord(b) : '');
  host.querySelector('[data-o="rad"]').textContent =
    (b.radius / RE_UNITS / K.SIZE_EXAG).toPrecision(3) + ' R⊕';
}

/* ====================================================================== *
 *  11. PRESETS                                                           *
 * ====================================================================== */
function addRoster(name, x, y, vx, vy, over) {
  const e = ROSTER.find(r => r.name === name);
  if (!e) throw new Error('no roster entry ' + name);
  const b = bodyFromRoster(Object.assign({}, e, over || {}), x, y, vx, vy);
  W.bodies.push(b);
  return b;
}
function addWorld(o) {
  const b = new Body({
    x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,
    shells: makeStack(o.m, o.f, { surface: o.T, mix: o.T }),
    rOverride: o.R || 0, fusing: !!o.fusing, stellarClass: o.stellarClass || null,
    coreMass: o.core || 0, name: o.name, spin: o.spin || 0,
  });
  if (o.fusing) b.lum = Math.pow(solarMasses(b.mass), 3.5);
  W.bodies.push(b);
  return b;
}

/* started at its own perihelion with the perihelion speed, so
 * eccentricities are real and Mercury's 0.21 is plainly visible          */
function atPerihelion(host, a, e, m, f, T, name, phase) {
  const rp = a * (1 - e);
  const mu = K.G * (host.mass + m);
  const vp = Math.sqrt(mu * (1 + e) / rp);
  const th = phase || 0;
  return addWorld({ x: host.x + Math.cos(th) * rp, y: host.y + Math.sin(th) * rp,
                    vx: host.vx - Math.sin(th) * vp, vy: host.vy + Math.cos(th) * vp,
                    m, f, T, name });
}

const PRESETS = [
  { name: 'Empty sky', build() { srand(1); } },

  { name: 'Solar system', build() {
      srand(7);
      const sun = addWorld({ x: 0, y: 0, m: K.SUN_MASS, f: { HHe: .99, Si: .01 }, T: 5772,
                             R: starR(1), fusing: true, stellarClass: 'sun-like',
                             core: 0.02 * K.SUN_MASS, name: 'Sun' });
      const P = [
        ['Mercury', 0.3871, 0.2056, 0.0553, { Fe: .70, Si: .30 }, 440],
        ['Venus',   0.7233, 0.0068, 0.815,  { Fe: .31, Si: .69 }, 737],
        ['Earth',   1.0000, 0.0167, 1.000,  { Fe: .32, Si: .675, H2O: .005 }, 288],
        ['Mars',    1.5237, 0.0934, 0.107,  { Fe: .24, Si: .76 }, 210],
        ['Jupiter', 5.2034, 0.0484, 317.8,  { HHe: .92, Si: .05, Fe: .03 }, 165],
        ['Saturn',  9.5371, 0.0542, 95.16,  { HHe: .88, Si: .08, Fe: .04 }, 134],
        ['Uranus', 19.1913, 0.0472, 14.54,  { HHe: .12, H2O: .70, Si: .12, Fe: .06 }, 76],
        ['Neptune',30.0690, 0.0086, 17.15,  { HHe: .12, H2O: .70, Si: .12, Fe: .06 }, 72],
      ];
      let i = 0;
      for (const [n, a, e, m, f, T] of P)
        atPerihelion(sun, a * K.AU, e, m, f, T, n, (i++) * 0.83);
      /* The main belt is motes, not bodies.  Motes feel the top six masses,
       * which here are the Sun and the four giants, and that is exactly the
       * set that carves the Kirkwood gaps.                                 */
      const jup = W.bodies.find(b => b.name === 'Jupiter');
      for (let k = 0; k < 2600; k++) {
        const a = rndRange(2.06, 3.32) * K.AU, e = Math.abs(gauss()) * 0.07;
        const th = TAU * rnd(), rp = a * (1 - e);
        const v = Math.sqrt(K.G * sun.mass * (1 + e) / rp);
        Motes.spawn(Math.cos(th) * rp, Math.sin(th) * rp,
                    -Math.sin(th) * v, Math.cos(th) * v,
                    3e-10, rnd() < 0.25 ? MAT.Fe : MAT.Si, 190, 0.05);
      }
      YEAR_UNITS = 2 * Math.PI * Math.sqrt(Math.pow(K.AU, 3) / (K.G * sun.mass));
      cam.x = 0; cam.y = 0; cam.scale = 0.55;
    } },

  /* §14: the one that shows the material system off.  Nothing here arranges
   * the outcome; the acceptance test is that the moon comes out iron-poor. */
  { name: 'Giant impact', build() {
      srand(1969);
      const target = addWorld({ x: 0, y: 0, m: 0.90, f: { Fe: .32, Si: .68 }, T: 1500, name: 'proto-Earth' });
      const imp = addWorld({ x: 0, y: 0, m: 0.13, f: { Fe: .26, Si: .74 }, T: 1400, name: 'impactor' });
      const rs = target.radius + imp.radius;
      const Mtot = target.mass + imp.mass;
      const d = 6 * rs;
      const vEsc = Math.sqrt(2 * K.G * Mtot / rs);
      const v0 = Math.sqrt(2 * K.G * Mtot / d);          // arrives at contact at v_esc

      target.x = -d * f1; target.y = -off * f1; target.vx = v0 * f1; target.vy = 0;

      const v = 0.30 * Math.sqrt(2 * K.G * (a.mass + b.mass) / (a.radius + b.radius));
      a.vx = v * 0.5; b.vx = -v * 0.5;

      const a = addWorld({ x: 0, y: 0, m: 2.2, f: { Fe: .35, Si: .55, H2O: .10 }, T: 2400, name: 'melt' });
      shatterBody(a); retireBody(a);

function loadPreset(name) {
  const p = PRESETS.find(q => q.name === name);
  if (!p) return false;
  clearAll();
  YEAR_UNITS = 2 * Math.PI * Math.sqrt(Math.pow(K.AU, 3) / (K.G * K.SUN_MASS));
  p.build();
  bodyAccelerations(W.bodies);
  rebuildClumps();
  applyRate();
  W.preset = name;
  return true;
}

/* ====================================================================== *
 *  12. THE LOOP AND THE SCRIPTING HOOK                                   *
 * ====================================================================== */
let clumpTimer = 0;

/* one full physics advance of exactly dt sim units.  Tests drive this
 * directly so results do not depend on machine speed.                     */
function advance(dt) {
  if (dt <= 0) return;
  /* §12: cap the BUDGET, not the count.  Cap the count and the substep
   * grows instead, and a circular orbit starts spiralling.  Only bodies
   * are integrated per substep, so the cost is n^2 over a few dozen
   * things rather than over the whole sky.                                */
  const n = Math.max(1, W.bodies.length);
  const nSub = clamp(Math.floor(W.substepBudget / (n * n)) || 1, 1, 400);
  const h = dt / nSub;
  for (let s = 0; s < nSub; s++) {
    stepBodies(h);
    for (let guard = 0; guard < 4; guard++) {
      const before = W.bodies.length;
      resolveCollisions();
      if (W.bodies.length === before) break;
    }
  }

  if (Motes.count) {
    /* motes step once a frame however many body substeps ran, but never so
     * far in one go that a fast mote steps through another one            */
    let vmax = 0, rmin = Infinity;
    for (let i = 0; i < Motes.count; i++) {
      const v = Math.abs(Motes.vx[i]) + Math.abs(Motes.vy[i]);
      if (v > vmax) vmax = v;
      if (Motes.r[i] < rmin) rmin = Motes.r[i];
    }
    const need = rmin > 0 && isFinite(rmin) ? Math.ceil(vmax * dt / rmin) : 1;
    const ms = clamp(need, 1, 16), mh = dt / ms;
    for (let s = 0; s < ms; s++) {
      measureClumps();
      const E0 = cloudMechanical();
      stepMotes(mh);
      positionSolve();
      velocitiesFromPositions(mh);
      measureClumps();
      depositHeat(E0 - cloudMechanical());
    }
    differentiate(dt);
    coolMotes(dt);
    absorbMotes();
    cullMotes(dt);
  }

  clumpTimer += dt;
  if (Motes.count && (clumpTimer > 0.004 * YEAR_UNITS || W.clumps.length === 0)) {
    clumpTimer = 0;
    rebuildClumps();
    trySettle();
  }
  W.t += dt;
}

let last = performance.now();
function tick(now) {
  const dtReal = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  if (!W.paused) advance(W.rate * dtReal);

  for (const g of spriteGhosts) { g.life += dtReal; g.x += g.vx * W.rate * dtReal; g.y += g.vy * W.rate * dtReal; }

  /* trails sampled by distance travelled, not per frame */
  if (UI.trails) {
    for (const b of W.bodies) {
      const step = 2.2 / cam.scale;
      if (!b.trailLast || (b.x - b.trailLast[0]) ** 2 + (b.y - b.trailLast[1]) ** 2 > step * step) {
        b.trail.push([b.x, b.y]); b.trailLast = [b.x, b.y];
        if (b.trail.length > 260) b.trail.shift();
      }
    }
  }
  if (UI.follow) { cam.x = UI.follow.x; cam.y = UI.follow.y; }

  drawFrame();
  if (UI.selected) updateInspector();
  hud();
  requestAnimationFrame(tick);
}

let hudT = 0, fps = 60;
function hud() {
  fps = fps * 0.93 + (1000 / Math.max(1, performance.now() - hudT)) * 0.07;
  hudT = performance.now();
  $('#hud').innerHTML =
    '<b>' + W.bodies.length + '</b> bodies · <b>' + Motes.count + '</b> motes · <b>' +
    W.clumps.length + '</b> clumps<br>' +
    'year = <b>' + YEAR_UNITS.toFixed(2) + '</b> units · t = <b>' +
    (W.t / YEAR_UNITS).toFixed(2) + '</b> yr<br>' +
    '<b>' + fps.toFixed(0) + '</b> fps';
}

/* ---- window.helxis ------------------------------------------------------ */
window.helxis = {
  list: () => W.bodies.map(b => ({
    id: b.id, name: b.name, cls: className(b), state: stateWord(b),
    m: b.mass, r: b.radius, x: b.x, y: b.y, vx: b.vx, vy: b.vy,
    T: b.surfaceT(), rockT: b.rockT(),
  })),
  get: id => W.bodies.find(b => b.id === id) || null,
  add: o => {
    const b = o.roster ? addRoster(o.roster, o.x || 0, o.y || 0, o.vx || 0, o.vy || 0)
                       : addWorld(o);
    bodyAccelerations(W.bodies);
    return b.id;
  },
  remove: id => { const b = W.bodies.find(q => q.id === id); if (b) retireBody(b); return !!b; },
  step: dt => advance(dt),
  run: (dt, n) => { for (let i = 0; i < n; i++) advance(dt); },
  energy: () => totalEnergy(),
  momentum: () => totalMomentum(),
  /* per material, including what has left the scene, so the books balance */
  mass: () => {
    const c = totalMass(); const out = {};
    for (let i = 0; i < NMAT; i++) out[MAT_NAMES[i]] = c[i] + escapedMass[i];
    out.total = compTotal(c) + compTotal(escapedMass);
    return out;
  },
  composition: id => {
    const b = W.bodies.find(q => q.id === id); if (!b) return null;
    const out = {}; for (let i = 0; i < NMAT; i++) out[MAT_NAMES[i]] = b.comp[i];
    return out;
  },
  className: id => { const b = W.bodies.find(q => q.id === id); return b ? className(b) : null; },
  orbit: id => {
    const b = W.bodies.find(q => q.id === id); if (!b) return null;
    const h = hostOf(b); if (!h) return null;
    const o = orbitOf(b, h); if (!o) return null;
    return Object.assign({ host: h.id, hostName: h.name }, o);
  },
  clumps: () => W.clumps.map(c => ({
    n: c.n, mass: c.mass, x: c.cx, y: c.cy, R: c.R, rockT: c.rockT,
    axisRatio: c.axisRatio, comp: Array.from(c.comp),
  })),
  motes: () => Motes.count,
  /* replace a body by motes sampled from its layer stack, which is what
   * §3.5 and §8.5 both do.  Exposed so a test can assert on the sampling
   * without having to arrange a collision first.                         */
  shatter: id => {
    const b = W.bodies.find(q => q.id === id); if (!b) return 0;
    const n = shatterBody(b).length; retireBody(b); return n;
  },
  preset: name => name === undefined ? W.preset : loadPreset(name),
  rate: v => { if (v === undefined) return W.rate; UI.rateSlider = v; applyRate(); return W.rate; },
  yearUnit: () => YEAR_UNITS,
  paused: p => { if (p !== undefined) setPaused(p); return W.paused; },
  seed: s => srand(s),
  events: () => W.events.slice(),
  heat: () => heatLedger.joules,
  /* design steps 6 to 10, not built yet.  They return null rather than a
   * plausible number, because a plausible number is worse than nothing.   */
  aging: () => null, flux: () => null, lagrange: () => null,
  K,
};
/* ---- boot -------------------------------------------------------------- */
resize();
buildPicker();
pick(null);                       // the picker starts holding nothing
wireDeck();
loadPreset('Solar system');
fitAll();
applyRate();
setPaused(true);
requestAnimationFrame(tick);
</script>
</body>
