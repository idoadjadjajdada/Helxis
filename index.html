<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Helxis</title>
<style>
  :root{
    --accent:#bb8dff; --live:#5ee6b8; --danger:#ff7a8a;
    --glass:rgba(28,16,48,.72); --edge:rgba(190,150,255,.18); --lip:rgba(220,200,255,.13);
    --ink:#e8dcff; --dim:#9d8cc0;
    --fast:130ms; --slow:260ms; --spring:cubic-bezier(.2,1.35,.4,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#05030c;color:var(--ink);
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}

  /* ---- deck ---------------------------------------------------------- */
  #deck{position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--glass);backdrop-filter:blur(14px) saturate(1.6);
    -webkit-backdrop-filter:blur(14px) saturate(1.6);
    border-top:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--lip)}
  .row{display:flex;align-items:center;gap:6px;padding:5px 8px}
  .row+.row{border-top:1px solid rgba(190,150,255,.10)}
  button,.btn{font:inherit;color:var(--ink);background:rgba(255,255,255,.045);
    border:1px solid var(--edge);border-radius:3px;padding:4px 8px;cursor:pointer;
    transition:background var(--fast) var(--spring),border-color var(--fast) var(--spring),
               transform var(--fast) var(--spring);white-space:nowrap}
  button:hover{background:rgba(187,141,255,.16);border-color:rgba(187,141,255,.4)}
  button:active{transform:translateY(1px)}
  button.on{background:rgba(187,141,255,.26);border-color:var(--accent);color:#fff}
  button.danger:hover{background:rgba(255,122,138,.2);border-color:var(--danger)}
  .sep{width:1px;align-self:stretch;background:rgba(190,150,255,.16);margin:0 3px}
  .lbl{color:var(--dim);font-size:10px;letter-spacing:.06em;text-transform:uppercase}

  #shelfJumps{display:flex;gap:3px;flex:0 0 auto}
  #shelfJumps button{padding:3px 6px;font-size:10px}
  #picker{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;flex:1 1 auto;
    scrollbar-width:thin;scrollbar-color:rgba(187,141,255,.35) transparent;padding-bottom:2px}
  #picker::-webkit-scrollbar{height:5px}
  #picker::-webkit-scrollbar-thumb{background:rgba(187,141,255,.35);border-radius:3px}
  .group{display:flex;gap:4px;align-items:flex-start;flex:0 0 auto}
  .group>.gname{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;
    color:var(--dim);letter-spacing:.1em;text-transform:uppercase;padding:2px 0;
    border-right:1px solid rgba(190,150,255,.14);margin-right:2px;cursor:pointer}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;
    padding:3px 2px;border:1px solid transparent;border-radius:4px;cursor:pointer;flex:0 0 auto;
    transition:background var(--fast) var(--spring),border-color var(--fast) var(--spring)}
  .chip:hover{background:rgba(187,141,255,.1)}
  .chip.on{background:rgba(187,141,255,.22);border-color:var(--accent)}
  .chip canvas{image-rendering:pixelated;width:26px;height:26px}
  .chip span{font-size:8.5px;color:var(--dim);text-align:center;line-height:1.15;
    overflow:hidden;text-overflow:ellipsis;width:100%}
  .chip.on span{color:#fff}

  #clockWrap{display:flex;align-items:center;gap:7px}
  #rateBig{font-size:16px;color:#fff;min-width:78px;text-align:right}
  #rateMul{font-size:10px;color:var(--dim);min-width:46px}
  #rate{width:150px;accent-color:var(--accent);cursor:pointer}
  #live{width:6px;height:6px;border-radius:50%;background:var(--live);
    box-shadow:0 0 6px var(--live);opacity:.25;transition:opacity var(--fast)}
  #live.on{opacity:1}
  #placeChip{display:flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--edge);
    border-radius:3px;color:var(--dim);font-size:10px}
  #placeChip canvas{image-rendering:pixelated;width:16px;height:16px}

  #clearBtn{position:relative;overflow:hidden}
  #clearFill{position:absolute;inset:0;background:rgba(255,122,138,.42);
    transform-origin:left;transform:scaleX(0);pointer-events:none}

  /* ---- popovers ------------------------------------------------------ */
  .pop{position:fixed;z-index:30;background:var(--glass);backdrop-filter:blur(16px) saturate(1.6);
    -webkit-backdrop-filter:blur(16px) saturate(1.6);border:1px solid var(--edge);
    border-radius:5px;box-shadow:0 -6px 28px rgba(0,0,0,.6),inset 0 1px 0 var(--lip);
    padding:9px;display:none;transform-origin:bottom left}
  .pop.open{display:block;animation:grow var(--slow) var(--spring)}
  @keyframes grow{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
  .pop h4{margin:0 0 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:400}
  .field{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:10.5px}
  .field label{width:58px;color:var(--dim)}
  .field input[type=range]{flex:1;accent-color:var(--accent);min-width:110px}
  .field output{width:62px;text-align:right;color:#fff}

  /* ---- inspector ----------------------------------------------------- */
  #insp{position:fixed;z-index:25;display:none;min-width:184px;max-width:230px;
    background:var(--glass);backdrop-filter:blur(16px) saturate(1.6);
    -webkit-backdrop-filter:blur(16px) saturate(1.6);
    border:1px solid var(--edge);border-radius:5px;padding:8px 9px;
    box-shadow:0 4px 22px rgba(0,0,0,.6),inset 0 1px 0 var(--lip);pointer-events:auto}
  #insp.open{display:block}
  #inspName{font-size:12.5px;color:#fff;margin-bottom:5px;display:flex;justify-content:space-between;gap:6px}
  #inspName b{font-weight:500}
  #inspClose{cursor:pointer;color:var(--dim);padding:0 2px}
  #inspClose:hover{color:var(--danger)}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;padding:1px 0}
  .kv i{color:var(--dim);font-style:normal}
  .kv b{font-weight:400;color:var(--ink)}
  #compBar{display:flex;height:8px;border-radius:2px;overflow:hidden;margin:6px 0 3px;
    border:1px solid rgba(190,150,255,.2)}
  #compBar div{height:100%}
  #compKey{display:flex;flex-wrap:wrap;gap:5px;font-size:8.5px;color:var(--dim)}
  #compKey span{display:flex;align-items:center;gap:2px}
  #compKey i{width:6px;height:6px;border-radius:1px;display:inline-block}
  #inspActs{display:flex;gap:5px;margin-top:7px}
  #inspActs button{flex:1;padding:3px 0;font-size:10px}
  #leader{position:fixed;z-index:24;pointer-events:none;inset:0;display:none}
  #leader.open{display:block}

  #hud{position:fixed;top:8px;left:10px;z-index:15;font-size:10px;color:var(--dim);
    pointer-events:none;line-height:1.6;text-shadow:0 1px 3px #000}
  #hud b{color:var(--ink);font-weight:400}
  #toast{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:40;
    background:var(--glass);border:1px solid var(--edge);border-radius:4px;padding:5px 11px;
    font-size:11px;opacity:0;transition:opacity var(--slow);pointer-events:none;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #toast.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:1ms!important;transition-duration:1ms!important}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<svg id="leader"><line stroke="rgba(187,141,255,.5)" stroke-width="1" stroke-dasharray="3 3"/></svg>
<div id="hud"></div>
<div id="toast"></div>

<div id="insp">
  <div id="inspName"><b>—</b><span id="inspClose">&#10005;</span></div>
  <div id="inspRows"></div>
  <div id="compBar"></div>
  <div id="compKey"></div>
  <div id="inspActs">
    <button id="followBtn">Follow</button>
    <button id="delBtn" class="danger">Delete</button>
  </div>
</div>

<div id="deck">
  <div class="row">
    <div id="shelfJumps"></div>
    <div class="sep"></div>
    <div id="picker"></div>
  </div>
  <div class="row">
    <button id="playBtn" title="Space">&#9654;</button>
    <div id="live"></div>
    <div class="sep"></div>
    <div id="clockWrap">
      <div id="rateBig">—</div>
      <div>
        <div id="rateMul">1&times;</div>
        <input id="rate" type="range" min="0" max="1000" value="420">
      </div>
    </div>
    <div class="sep"></div>
    <button id="dragBtn" title="D">Drag</button>
    <button id="orbitBtn" class="on" title="O">Orbits</button>
    <button id="trailBtn" class="on" title="T">Trails</button>
    <button id="autoBtn" class="on">Auto-orbit</button>
    <div class="sep"></div>
    <div id="placeChip"><canvas width="16" height="16"></canvas><span>nothing</span></div>
    <div class="sep"></div>
    <button id="sysBtn">Systems</button>
    <button id="forgeBtn" title="G">Forge</button>
    <button id="fitBtn" title="F">Fit</button>
    <button id="clearBtn" class="danger" title="hold"><span id="clearFill"></span>Hold to clear</button>
  </div>
</div>

<div class="pop" id="sysPop"><h4>Systems</h4><div id="sysList"></div></div>
<div class="pop" id="forgePop"><h4>Forge</h4><div id="forgeBody"></div></div>

<script>
"use strict";
/* ====================================================================== *
 *  1. CONSTANTS AND SCALES                                               *
 * ---------------------------------------------------------------------- *
 *  Three scales are chosen rather than measured; every other number here  *
 *  is either measured or falls out of one that is.  See README §"What is  *
 *  deliberately wrong".                                                   *
 * ====================================================================== */
const K = {
  G: 1,                    // by construction; the other scales are chosen to make it true
  /* Softening has to be small next to the smallest thing it acts between,
   * or a close orbit stops being a Kepler orbit and the eccentricity
   * readout stops meaning anything.  Earth's display radius is 0.16, so
   * 0.35 was more than twice it: a moon at 2.6 planet radii came back
   * reading e = 0.56 on an orbit that was in fact circular.               */
  SOFT: 0.01,              // softening length, world units
  SOFT2: 0.01 * 0.01,

  /* mass -------------------------------------------------------------- */
  /* The design asked for a Sun of 3,000 Earth masses AND every planet
   * lifted twenty-fold.  Those cannot both hold.  Mass is conserved
   * additively through every merge, so the mass axis has to be linear,
   * and a linear axis cannot compress the star-to-planet ratio while
   * leaving planet-to-planet ratios real -- lifting the planets by 20
   * and dropping the Sun to 3,000 makes Jupiter (6,356) twice the weight
   * of its own star.  A 111x compression also inverts the roster: no
   * real brown dwarf outweighs Jupiter once stars are divided by 111.
   * So: planets keep their true Earth masses, and the Sun alone is
   * compressed, by 10x rather than 111x.  That still buys a Sun that
   * visibly circles its own barycentre at inner-system zoom, and it
   * leaves every other ratio in the roster intact.                      */
  SUN_MASS: 33300,         // Earth masses; the true figure is 333,000
  PLANET_LIFT: 1,          // planets are at their true Earth masses

  /* distance ---------------------------------------------------------- */
  AU: 150,                 // world units per AU

  /* size -------------------------------------------------------------- */
  /* The design says 80x in §2 and then, in §14, works out that the Moon
   * must land "at two" Earth radii instead of sixty.  Sixty over eighty
   * is 0.75, not two; sixty over twenty-five is 2.4.  §14's arithmetic is
   * the one that has to hold, because it is what makes moon systems fit,
   * and 80x also puts the Sun's own surface outside Mercury's perihelion.
   * So: 25x.  Visibility of small worlds is MIN_PX's job, not the
   * exaggeration's -- which is what §2 says MIN_PX is for.               */
  SIZE_EXAG: 25,           // display radii are 25x true radii
  /* Stars compound the problem: 25x would put the Sun's surface 17 world
   * units out and a red giant's 1,750, swallowing Saturn.  Fusing bodies
   * and remnants take 2x instead, which puts a red giant's surface just
   * inside Earth's orbit, where a real one reaches.                      */
  STAR_EXAG: 2,
  MIN_PX: 2,               // nothing is ever drawn under two buffer pixels

  /* real-world constants, SI, used only to restore honest energetics --- */
  SI_G: 6.674e-11,
  SI_MEARTH: 5.972e24,
  SI_REARTH: 6.371e6,
  SI_AU: 1.495979e11,
  SI_YEAR: 3.1557e7,
  SI_RJUP: 6.9911e7,
  SI_MJUP: 1.89813e27,
  SI_MSUN: 1.98892e30,
  SI_SB: 5.670e-8,         // Stefan-Boltzmann

  /* chosen: the speed of light, set so precession is legible ----------- */
  C_LIGHT: 1400,           // world units per sim time unit (true value ~45000)

  MOTE_CAP: 200000,
};

/* The year is derived, never written down.  It is the period of a circular
 * orbit at one AU around the star this preset actually built.  Retune the
 * distance scale or the star's mass and the readout follows.             */
let YEAR_UNITS = 2 * Math.PI * Math.sqrt(Math.pow(K.AU, 3) / (K.G * K.SUN_MASS));
let YEAR_LABEL = 'yr';

function deriveYear(hostMass, auInUnits, realPeriodYears) {
  // period of a circular orbit at auInUnits around hostMass, expressed so
  // that one "year" of the reference orbit is one YEAR_UNITS.
  const T = 2 * Math.PI * Math.sqrt(Math.pow(auInUnits, 3) / (K.G * hostMass));
  return T / (realPeriodYears || 1);
}

/* ---- unit bridges ---------------------------------------------------- *
 * Velocity comes out honest for free: distances are real and the time unit
 * was derived from them, so one sim velocity unit is a real number of m/s.
 * Masses and radii each carry one admitted exaggeration, and the two
 * functions below undo them so that collision energetics run in SI.       */
const SI = {
  get vel()  { return (K.SI_AU / K.AU) / (K.SI_YEAR / YEAR_UNITS); },   // m/s per sim unit
  get len()  { return K.SI_AU / K.AU; },                                // m per world unit
  mass(m)    { return (m / K.PLANET_LIFT) * K.SI_MEARTH; },             // kg from sim mass
  radius(r)  { return (r / K.SIZE_EXAG) * (K.SI_AU / K.AU); },          // m from display radius
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const TAU   = Math.PI * 2;

/* deterministic PRNG, so a seeded run reproduces exactly ---------------- */
let _seed = 0x9e3779b9 >>> 0;
function srand(s) { _seed = (s >>> 0) || 1; }
function rnd() {
  _seed ^= _seed << 13; _seed >>>= 0;
  _seed ^= _seed >>> 17;
  _seed ^= _seed << 5;  _seed >>>= 0;
  return _seed / 4294967296;
}
const rndRange = (a, b) => a + (b - a) * rnd();
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

/* ====================================================================== *
 *  2. MATERIALS                                                          *
 * ---------------------------------------------------------------------- *
 *  Five things, and the total mass of each is conserved exactly through   *
 *  every collision, collapse, escape and crumble.  There is no "molten"   *
 *  material: molten is a temperature.                                     *
 * ====================================================================== */
const MAT = { Fe: 0, Si: 1, C: 2, H2O: 3, HHe: 4 };
const MAT_NAMES = ['Fe', 'Si', 'C', 'H2O', 'HHe'];
const NMAT = 5;

const MATS = [
  /* Fe  */ { name: 'Fe',  full: 'Iron',     rho: 7900, melt: 1810, volatile: false,
              /* J/kg to bring to the melt from 300 K, latent heat included */
              qMelt: 450 * 1510 + 2.47e5, qVap: 6.3e6,
              base: [0x79, 0x76, 0x7f], lum: 0.47 },
  /* Si  */ { name: 'Si',  full: 'Silicate', rho: 3300, melt: 1500, volatile: false,
              qMelt: 1000 * 1200 + 4.0e5, qVap: 1.3e7,
              base: [0x7d, 0x6a, 0x55], lum: 0.42 },
  /* C   */ { name: 'C',   full: 'Carbon',   rho: 3500, melt: 3820, volatile: false,
              qMelt: 710 * 3520 + 1.2e5, qVap: 6.0e7,
              base: [0x33, 0x30, 0x38], lum: 0.19 },
  /* H2O */ { name: 'H2O', full: 'Water',    rho: 1000, rhoIce: 920, melt: 273, volatile: true,
              qMelt: 2100 * 123 + 3.34e5, qVap: 2.6e6,
              base: [0xc6, 0xdc, 0xe8], lum: 0.85 },
  /* HHe */ { name: 'HHe', full: 'H/He',     rho: 90,   melt: 0,    volatile: true,
              qMelt: Infinity, qVap: 4.5e5,
              base: [0xd6, 0xcc, 0xa8], lum: 0.80 },
];

/* densities above are uncompressed; self-compression is applied in §3 */

/* ---- incandescence --------------------------------------------------- *
 *  Colour comes from material AND temperature together.  Above about
 *  800 K the hue is the blackbody hue and the material shows through as
 *  light and dark, which is why two worlds folded into a melt stay
 *  distinguishable.  Tinting a material colour toward orange instead
 *  turns rock and iron the same shade of sand.                            */
const BB_KEYS = [
  [  800, 0x55, 0x0c, 0x02],
  [ 1200, 0x9c, 0x27, 0x03],
  [ 1600, 0xd2, 0x51, 0x07],
  [ 2000, 0xf2, 0x84, 0x1c],
  [ 2600, 0xff, 0xbe, 0x60],
  [ 3400, 0xff, 0xe2, 0xae],
  [ 5000, 0xff, 0xf4, 0xe4],
  [ 8000, 0xe4, 0xec, 0xff],
  [20000, 0xc0, 0xd4, 0xff],
];
function blackbody(T) {
  if (T <= BB_KEYS[0][0]) return [BB_KEYS[0][1], BB_KEYS[0][2], BB_KEYS[0][3]];
  for (let i = 1; i < BB_KEYS.length; i++) {
    if (T <= BB_KEYS[i][0]) {
      const a = BB_KEYS[i - 1], b = BB_KEYS[i];
      const t = (T - a[0]) / (b[0] - a[0]);
      return [lerp(a[1], b[1], t), lerp(a[2], b[2], t), lerp(a[3], b[3], t)];
    }
  }
  const z = BB_KEYS[BB_KEYS.length - 1];
  return [z[1], z[2], z[3]];
}

/* how much of what you see is glow rather than reflected light */
function glowFrac(T) {
  if (T < 700) return 0;
  const x = (T - 700) / 900;             // fully incandescent by ~1600 K
  return clamp(x * x, 0, 1);
}

const _col = [0, 0, 0];
function matColour(mat, T, shade) {
  const m = MATS[mat];
  const g = glowFrac(T);
  const s = shade === undefined ? 1 : shade;
  let r, gr, b;
  if (g <= 0) {
    r = m.base[0]; gr = m.base[1]; b = m.base[2];
    if (mat === MAT.H2O && T > 273) { r = 0x3d; gr = 0x6e; b = 0xa8; }   // liquid water
  } else {
    const bb = blackbody(T);
    /* hue from temperature, material as light and dark */
    const k = 0.55 + 0.9 * m.lum;
    r  = lerp(m.base[0], bb[0] * k, g);
    gr = lerp(m.base[1], bb[1] * k, g);
    b  = lerp(m.base[2], bb[2] * k, g);
  }
  _col[0] = clamp(r * s, 0, 255) | 0;
  _col[1] = clamp(gr * s, 0, 255) | 0;
  _col[2] = clamp(b * s, 0, 255) | 0;
  return _col;
}

/* ---- viscosity ------------------------------------------------------- *
 *  Denser motes sink at a rate set by density contrast over viscosity,
 *  and viscosity is a steep function of temperature because cold rock
 *  does not flow.  A shallow law gives clean concentric layers every
 *  time; the steepness is where the swirl comes from.                     */
function mobility(mat, T) {
  const m = MATS[mat];
  if (!isFinite(m.melt) || m.melt <= 0) return 1;
  const w = 0.055 * m.melt;                    // sigmoid width, ~6% of the melt point
  const s = 1 / (1 + Math.exp(-(T - m.melt) / w));
  if (T <= m.melt) return s * 0.02;            // solid rock creeps, barely
  const sup = Math.min(6, Math.pow(T / m.melt, 3));
  return s * sup;
}

/* uncompressed density, with ice below freezing */
function matRho(mat, T) {
  const m = MATS[mat];
  if (mat === MAT.H2O && T < m.melt) return m.rhoIce;
  return m.rho;
}

/* empty composition vector ------------------------------------------- */
const zeroComp = () => new Float64Array(NMAT);
function compTotal(c) { let s = 0; for (let i = 0; i < NMAT; i++) s += c[i]; return s; }
function compAdd(dst, src, scale) {
  const k = scale === undefined ? 1 : scale;
  for (let i = 0; i < NMAT; i++) dst[i] += src[i] * k;
  return dst;
}

/* ====================================================================== *
 *  3. BODIES                                                             *
 * ---------------------------------------------------------------------- *
 *  A body is a stack of shells ordered by density, innermost first.       *
 *  Nothing stores what kind of thing a body is; the name is a function of  *
 *  the stack, evaluated whenever it is needed.                            *
 * ====================================================================== */

/* ---- mass-radius ----------------------------------------------------- *
 *  Condensed material: R proportional to M^0.279 above about 0.14 M(E),
 *  uncompressed below it.  0.279 is Chen & Kipping's measured terran
 *  exponent and matches the 0.27 quoted from memory in the design.
 *  Envelopes: the Neptunian and Jovian branches of the same fit, re-
 *  anchored on Jupiter so the curve is continuous and Saturn lands where
 *  Saturn is.  The Jovian exponent is -0.044, so a giant flattens at
 *  about one Jupiter radius and then shrinks very slowly.  The steep
 *  inverse case is degenerate matter (R proportional to M^-1/3), which
 *  belongs to remnants and not to gas.                                    */
const CK = {
  terA: 1.008, terB: 0.279,       // R(Re) = terA * M^terB
  nepA: 0.6572, nepB: 0.589,
  jovA: 14.43,  jovB: -0.044,
  break1: 3.98,                   // terran/neptunian crossing
  break2: 131.6,                  // neptunian/jovian crossing
};
function ckRadiusEarth(Me) {                     // real Earth masses -> real Earth radii
  if (Me <= 0) return 0;
  if (Me < CK.break1) return CK.terA * Math.pow(Me, CK.terB);
  if (Me < CK.break2) return CK.nepA * Math.pow(Me, CK.nepB);
  return CK.jovA * Math.pow(Me, CK.jovB);
}

/* compression factor for condensed material, calibrated so a one-Earth-mass
 * silicate world lands on the terran branch and small bodies stay
 * uncompressed.                                                            */
function compression(Me) {
  if (Me <= 0) return 1;
  return Math.min(1, 0.90 * Math.pow(Me, CK.terB - 1 / 3));
}

/* display radius, world units, from a composition vector in sim mass */
function radiusOf(comp) {
  const M = compTotal(comp);
  if (M <= 0) return 0;
  let volCond = 0, mCond = 0;
  for (let i = 0; i < NMAT; i++) {
    if (i === MAT.HHe) continue;
    const kg = SI.mass(comp[i]);
    volCond += kg / MATS[i].rho;
    mCond += comp[i];
  }
  const McondE = mCond / K.PLANET_LIFT;
  let rCond = volCond > 0 ? Math.cbrt(3 * volCond / (4 * Math.PI)) : 0;   // metres
  rCond *= compression(McondE);
  const rCondE = rCond / K.SI_REARTH;

  const fHHe = comp[MAT.HHe] / M;
  let rE = rCondE;
  if (fHHe > 0) {
    const w = clamp(fHHe / 0.15, 0, 1);
    const rCK = ckRadiusEarth(M / K.PLANET_LIFT);
    rE = rCondE + w * Math.max(0, rCK - rCondE);
  }
  /* real Earth radii -> world units, then the admitted 80x exaggeration */
  return rE * K.SI_REARTH / SI.len * K.SIZE_EXAG;
}

/* the mass above which a body has had time and heat to sort itself:
 * roughly 500 km radius, which is about 1e-4 real Earth masses.           */
const DIFF_MASS = 1e-4 * K.PLANET_LIFT;

let _nextId = 1;

class Body {
  constructor(o) {
    this.id = o.id || _nextId++;
    this.x = o.x || 0; this.y = o.y || 0;
    this.vx = o.vx || 0; this.vy = o.vy || 0;
    this.ax = 0; this.ay = 0;
    this.shells = o.shells || [];        // [{comp:Float64Array, T}] innermost first
    this.spin = o.spin || 0;             // radians per sim time unit
    this.angle = o.angle || 0;
    this.held = false;
    this.name = o.name || null;          // preset label, never the class
    this.trail = [];
    this.trailLast = null;
    this.rOverride = o.rOverride || 0;        // stars and remnants: radius from their own track
    this.inflated = !!o.inflated;
    this.stellarClass = o.stellarClass || null;
    this.remnant = o.remnant || null;
    this.surfaceMap = o.surfaceMap || null;   // projected from motes when it settled
    this.sprite = null; this.spriteKey = '';
    this.seed = o.seed || (rnd() * 1e9) | 0;
    /* stellar, filled in by §7 */
    this.fusing = !!o.fusing;
    this.coreMass = o.coreMass || 0;
    this.coreFuel = o.coreFuel === undefined ? 1 : o.coreFuel;
    this.lum = o.lum || 0;
    this.comp = zeroComp();
    this.shellR = new Float64Array(Math.max(1, this.shells.length));
    this.refresh();
  }

  refresh() {
    const c = this.comp; c.fill(0);
    for (const s of this.shells) compAdd(c, s.comp);
    this.mass = compTotal(c);
    this.radius = Math.max(1e-6, this.rOverride || radiusOf(c));
    /* shell outer radii: cumulative compressed volume, rescaled so the
     * outermost shell's radius is the body's radius.                      */
    const n = this.shells.length;
    if (this.shellR.length !== n) this.shellR = new Float64Array(n);
    let cum = zeroComp(), last = 0;
    for (let k = 0; k < n; k++) {
      compAdd(cum, this.shells[k].comp);
      last = radiusOf(cum);
      this.shellR[k] = last;
    }
    if (last > 0) { const s = this.radius / last; for (let k = 0; k < n; k++) this.shellR[k] *= s; }
    return this;
  }

  get differentiated() { return this.mass >= DIFF_MASS && this.shells.length > 1; }

  /* mass-weighted mean temperature, and the temperature of the rock alone */
  meanT() {
    let w = 0, s = 0;
    for (const sh of this.shells) { const m = compTotal(sh.comp); w += m; s += m * sh.T; }
    return w > 0 ? s / w : 0;
  }
  rockT() {
    let w = 0, s = 0;
    for (const sh of this.shells) {
      const m = sh.comp[MAT.Fe] + sh.comp[MAT.Si] + sh.comp[MAT.C];
      w += m; s += m * sh.T;
    }
    return w > 0 ? s / w : this.meanT();
  }
  surfaceT() { return this.shells.length ? this.shells[this.shells.length - 1].T : 0; }

  /* what the outermost shell is made of, which is what you can see */
  surfaceFrac(mat) {
    const sh = this.shells[this.shells.length - 1];
    if (!sh) return 0;
    const t = compTotal(sh.comp);
    return t > 0 ? sh.comp[mat] / t : 0;
  }

  frac(mat) { return this.mass > 0 ? this.comp[mat] / this.mass : 0; }
  realMassEarth() { return this.mass / K.PLANET_LIFT; }

  /* specific binding energy, J/kg, at the body's TRUE radius.  Display
   * radii are 80x too large, so using them here would make every world
   * 80x easier to melt than it is.                                        */
  bindingSpecific() {
    const M = SI.mass(this.mass), R = SI.radius(this.radius);
    return R > 0 ? 3 * K.SI_G * M / (5 * R) : 0;
  }
  escapeSpeed() {   // sim units, at the DISPLAY surface, which is what motes leave from
    return Math.sqrt(2 * K.G * this.mass / Math.max(this.radius, K.SOFT));
  }
}

/* ---- the class name is read off the composition ----------------------- *
 *  Order matters, first match wins.  Two departures from the design, both
 *  deliberate: hot Jupiter is tested before gas giant (otherwise the gas
 *  giant rule swallows it and the entry is unreachable), and stripped core
 *  has a rule of its own, because the design's table had no way to name
 *  one even though §9.2 requires the name to appear on its own.           *
 *  Masses below are REAL Earth masses, not lifted sim units.              */
function className(b, ctx) {
  if (b.fusing) return stellarName(b);
  if (b.remnant) return b.remnant;

  const Me = b.realMassEarth();
  const fFe = b.frac(MAT.Fe), fC = b.frac(MAT.C), fHHe = b.frac(MAT.HHe);
  const fH2Osurf = b.surfaceFrac(MAT.H2O);
  const T = b.surfaceT();
  const ecc = ctx && ctx.e !== undefined ? ctx.e : (b._ecc || 0);

  if (Me < 1e-6) return 'planetesimal';
  if (Me < 1e-3) {
    if (b.frac(MAT.H2O) > 0.3 && ecc > 0.25) return 'comet';
    return 'asteroid';
  }
  if (Me < 0.02) return Me < 5e-3 ? 'dwarf planet' : 'moon';

  if (fHHe > 0.01 && T > 1000 && b.inflated) return 'hot Jupiter';
  if (fHHe > 0.5) return 'gas giant';
  /* the design's 0.15 threshold puts Uranus and Neptune outside their own
   * class: both carry 8-15% H/He by mass and land at 0.12 here.  0.08 is
   * the bottom of the measured range and is what the entry needs.       */
  if (fHHe > 0.08) return Me > 10 ? 'ice giant' : 'mini-Neptune';

  /* a giant that lost its envelope is hot and dry, and cools into a
   * super-Earth on its own, which is what really happens to one.          */
  if (Me > 3 && fHHe < 0.02 && b.frac(MAT.H2O) < 0.02 && T > 1000) return 'stripped core';

  if (fFe > 0.55) return 'iron world';
  if (fC  > 0.35) return 'carbon world';
  /* "H2O at the surface" has to mean the water is a real part of the body
   * AND it is what you are standing on.  Reading it as the surface SHELL's
   * own water fraction makes every world with a puddle an ocean world:
   * Earth's water shell is pure water, so that test scores 1.0 on a planet
   * that is 0.5% water.                                                  */
  if (b.frac(MAT.H2O) > 0.25 && fH2Osurf > 0.5) return T > 273 ? 'ocean world' : 'ice world';
  if (Me > 3 && b.frac(MAT.Si) >= Math.max(fFe, fC, b.frac(MAT.H2O))) return 'super-Earth';
  return 'rocky world';
}

/* molten is a temperature, so it is a state word and never a class */
function stateWord(b) {
  if (b.fusing || b.remnant) return '';
  const rt = b.rockT(), rock = b.frac(MAT.Fe) + b.frac(MAT.Si) + b.frac(MAT.C);
  if (rock > 0.2) {
    if (rt > MATS[MAT.Si].melt + 600) return 'vaporising';
    if (rt > MATS[MAT.Si].melt) return 'molten';
    if (rt > MATS[MAT.Si].melt - 350) return 'cooling';
  }
  if (b.frac(MAT.H2O) > 0.15 && b.surfaceT() < 273) return 'frozen';
  return '';
}
function stellarName(b) { return b.stellarClass || 'star'; }

/* ---- constructing a stack -------------------------------------------- *
 *  Fractions are by mass.  Below the differentiation mass a body is one
 *  mixed shell, because it was never hot enough to sort itself.           */
function makeStack(massSim, fracs, temps) {
  const order = [[MAT.Fe], [MAT.Si, MAT.C], [MAT.H2O], [MAT.HHe]];
  let tot = 0; for (const k in fracs) tot += fracs[k];
  if (tot <= 0) { fracs = { Si: 1 }; tot = 1; }
  const comp = zeroComp();
  for (const k in fracs) comp[MAT[k]] = massSim * fracs[k] / tot;

  if (massSim < DIFF_MASS) {
    const T = temps && temps.mix !== undefined ? temps.mix : (temps && temps.surface) || 180;
    return [{ comp, T }];
  }
  /* interpolate over the layers this body ACTUALLY has.  Spreading the
   * gradient over all four when only two exist leaves the outermost shell
   * a third of the way to the core temperature, and §3.4 reads the class
   * name off the surface temperature, so a cool super-Earth comes back
   * labelled a stripped core.                                             */
  const present = [];
  for (let li = 0; li < order.length; li++) {
    const sc = zeroComp(); let any = 0;
    for (const m of order[li]) { sc[m] = comp[m]; any += comp[m]; }
    if (any > 0) present.push({ li, comp: sc });
  }
  const surf = (temps && temps.surface) || 288;
  const core = (temps && temps.core) || Math.max(surf, 1200 + 2400 * Math.pow(massSim, 0.4));
  const shells = [];
  for (let k = 0; k < present.length; k++) {
    const p = present[k];
    let T;
    if (temps && temps.layers && temps.layers[p.li] !== undefined) T = temps.layers[p.li];
    else T = lerp(core, surf, present.length > 1 ? k / (present.length - 1) : 1);
    shells.push({ comp: p.comp, T });
  }
  return shells;
}

/* ====================================================================== *
 *  4. INTEGRATOR                                                         *
 * ---------------------------------------------------------------------- *
 *  Velocity Verlet, which is symplectic: orbits keep their shape over     *
 *  long runs instead of spiralling the way plain Euler makes them.        *
 *  Accelerations carry between steps, so gravity is evaluated once.       *
 * ====================================================================== */
const W = {
  bodies: [],
  t: 0,                 // sim time units
  paused: true,
  rate: 1,              // sim time units per real second
  substepBudget: 900,   // body-integrations per frame; see §12
  lastDt: 0,
  clumps: [],
  events: [],
};

function bodyAccelerations(bodies) {
  const n = bodies.length;
  for (let i = 0; i < n; i++) { bodies[i].ax = 0; bodies[i].ay = 0; }
  for (let i = 0; i < n; i++) {
    const a = bodies[i];
    for (let j = i + 1; j < n; j++) {
      const b = bodies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const r2 = dx * dx + dy * dy + K.SOFT2;
      const inv = 1 / (r2 * Math.sqrt(r2));
      const fx = dx * inv, fy = dy * inv;
      a.ax += fx * b.mass; a.ay += fy * b.mass;
      b.ax -= fx * a.mass; b.ay -= fy * a.mass;
    }
  }
}

function stepBodies(dt) {
  const bs = W.bodies, n = bs.length;
  for (let i = 0; i < n; i++) {
    const b = bs[i];
    if (b.held) continue;
    b.x += b.vx * dt + 0.5 * b.ax * dt * dt;
    b.y += b.vy * dt + 0.5 * b.ay * dt * dt;
    b.angle += b.spin * dt;
  }
  const oax = new Float64Array(n), oay = new Float64Array(n);
  for (let i = 0; i < n; i++) { oax[i] = bs[i].ax; oay[i] = bs[i].ay; }
  bodyAccelerations(bs);
  for (let i = 0; i < n; i++) {
    const b = bs[i];
    if (b.held) { b.ax = 0; b.ay = 0; continue; }   // held: out of the integrator's hands,
    b.vx += 0.5 * (oax[i] + b.ax) * dt;             // but still pulling on everything else
    b.vy += 0.5 * (oay[i] + b.ay) * dt;
  }
}

/* the speed that balances the softened force law.  The textbook
 * sqrt(GM/r) launches a close moon about a quarter too fast, which strips
 * it off its planet inside two simulated years.                           */
function circularSpeed(M, r) {
  const r2 = r * r + K.SOFT2;
  return Math.sqrt(K.G * M) * r / Math.pow(r2, 0.75);
}

function totalEnergy() {
  let ke = 0, pe = 0;
  const bs = W.bodies;
  for (let i = 0; i < bs.length; i++) {
    const a = bs[i];
    ke += 0.5 * a.mass * (a.vx * a.vx + a.vy * a.vy);
    for (let j = i + 1; j < bs.length; j++) {
      const b = bs[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      pe -= K.G * a.mass * b.mass / Math.sqrt(dx * dx + dy * dy + K.SOFT2);
    }
  }
  const M = Motes;
  for (let i = 0; i < M.count; i++) {
    ke += 0.5 * M.m[i] * (M.vx[i] * M.vx[i] + M.vy[i] * M.vy[i]);
    for (let j = 0; j < bs.length; j++) {
      const b = bs[j];
      const dx = b.x - M.x[i], dy = b.y - M.y[i];
      pe -= K.G * M.m[i] * b.mass / Math.sqrt(dx * dx + dy * dy + K.SOFT2);
    }
  }
  return { ke, pe, total: ke + pe };
}

/* `scalar` is the sum of |m v| over everything in the sky.  A closed
 * system started from rest has px = py = 0, so a drift in the vector has
 * nothing of its own size to be measured against; the scalar is the
 * momentum that is actually moving around inside it, and it is the only
 * honest yardstick for "did any of this leak".                           */
function totalMomentum() {
  let px = 0, py = 0, scalar = 0;
  for (const b of W.bodies) {
    px += b.mass * b.vx; py += b.mass * b.vy;
    scalar += b.mass * Math.hypot(b.vx, b.vy);
  }
  const M = Motes;
  for (let i = 0; i < M.count; i++) {
    px += M.m[i] * M.vx[i]; py += M.m[i] * M.vy[i];
    scalar += M.m[i] * Math.hypot(M.vx[i], M.vy[i]);
  }
  return { px, py, scalar };
}

/* mass in each of the five materials, everywhere in the simulation */
function totalMass() {
  const c = zeroComp();
  for (const b of W.bodies) compAdd(c, b.comp);
  const M = Motes;
  for (let i = 0; i < M.count; i++) c[M.mat[i]] += M.m[i];
  return c;
}

/* ---- orbital elements from the state vector --------------------------- *
 *  Energy gives the semi-major axis; the eccentricity vector gives both
 *  the shape and the direction of periapsis, which a scalar eccentricity
 *  cannot.                                                                */
function orbitOf(b, host) {
  if (!host || host === b) return null;
  const dx = b.x - host.x, dy = b.y - host.y;
  const dvx = b.vx - host.vx, dvy = b.vy - host.vy;
  const r = Math.hypot(dx, dy);
  if (r < 1e-9) return null;
  const mu = K.G * (host.mass + b.mass);
  const v2 = dvx * dvx + dvy * dvy;
  const h = dx * dvy - dy * dvx;                       // specific angular momentum, z only
  const energy = v2 / 2 - mu / r;
  if (energy >= 0) return { bound: false, e: 1 + 2 * energy * h * h / (mu * mu), a: Infinity, h };
  const a = -mu / (2 * energy);
  /* eccentricity vector */
  const ex = (v2 / mu - 1 / r) * dx - (dx * dvx + dy * dvy) / mu * dvx;
  const ey = (v2 / mu - 1 / r) * dy - (dx * dvx + dy * dvy) / mu * dvy;
  const e = Math.hypot(ex, ey);
  const argp = Math.atan2(ey, ex);
  const T = TAU * Math.sqrt(a * a * a / mu);
  return { bound: true, a, e, argp, h, T, r, peri: a * (1 - e), apo: a * (1 + e), retro: h < 0 };
}

/* the thing a body is most plausibly going round: the one whose pull
 * dominates and which the body is actually bound to.                      */
function hostOf(b) {
  let best = null, bestScore = 0;
  for (const o of W.bodies) {
    if (o === b || o.mass <= b.mass) continue;
    const dx = o.x - b.x, dy = o.y - b.y;
    const r2 = dx * dx + dy * dy + K.SOFT2;
    const score = o.mass / r2;
    if (score > bestScore) {
      const orb = orbitOf(b, o);
      if (orb && orb.bound) { bestScore = score; best = o; }
    }
  }
  return best;
}

/* ====================================================================== *
 *  5. MOTES                                                              *
 * ---------------------------------------------------------------------- *
 *  Written before collisions rather than after, because every collision    *
 *  outcome is expressed in motes and nothing here depends on collisions.   *
 *                                                                         *
 *  A mote has a position, a velocity, a mass, a material and a            *
 *  temperature.  From the moment a body is destroyed the mote is the unit  *
 *  of bookkeeping, and nothing downstream invents or destroys material.    *
 * ====================================================================== */
const Motes = {
  cap: K.MOTE_CAP,
  count: 0,
  x:  new Float64Array(K.MOTE_CAP), y:  new Float64Array(K.MOTE_CAP),
  vx: new Float64Array(K.MOTE_CAP), vy: new Float64Array(K.MOTE_CAP),
  m:  new Float64Array(K.MOTE_CAP),
  T:  new Float32Array(K.MOTE_CAP),
  r:  new Float32Array(K.MOTE_CAP),
  mat:   new Uint8Array(K.MOTE_CAP),
  clump: new Int32Array(K.MOTE_CAP),
  nb:    new Uint8Array(K.MOTE_CAP),      // neighbours, from the contact pass
  age:   new Float32Array(K.MOTE_CAP),
  limit: K.MOTE_CAP,

  clear() { this.count = 0; this.ghost.fill(0); },

  spawn(x, y, vx, vy, m, mat, T, r) {
    if (this.count >= this.limit) return -1;
    const i = this.count++;
    this.x[i] = x; this.y[i] = y; this.vx[i] = vx; this.vy[i] = vy;
    this.m[i] = m; this.mat[i] = mat; this.T[i] = T; this.r[i] = r;
    this.clump[i] = -1; this.nb[i] = 0; this.age[i] = 0;
    this.ghost[i] = 0;      // slots are reused; a stale ghost bit fades a live
    return i;               // mote out and takes its mass with it
  },

  /* swap with the last live mote; callers iterating downward are safe */
  remove(i) {
    const last = --this.count;
    if (i !== last) {
      this.x[i] = this.x[last]; this.y[i] = this.y[last];
      this.vx[i] = this.vx[last]; this.vy[i] = this.vy[last];
      this.m[i] = this.m[last]; this.T[i] = this.T[last]; this.r[i] = this.r[last];
      this.mat[i] = this.mat[last]; this.clump[i] = this.clump[last];
      this.nb[i] = this.nb[last]; this.age[i] = this.age[last];
      this.ghost[i] = this.ghost[last];   // every field, or a live mote lands
                                          // in a ghost's slot and fades away
    }
  },

  massOf() { let s = 0; for (let i = 0; i < this.count; i++) s += this.m[i]; return s; },
};

/* ---- shattering a body ------------------------------------------------ *
 *  One mote per sprite pixel, in place, at the speed the body was going,
 *  each tagged with the material of the shell it came from and that
 *  shell's temperature.  The sampling is radial: a mote drawn from the
 *  middle of the disc is more likely to be core material, one from the rim
 *  is envelope.  Sampling is by projected VOLUME, so a core mote comes out
 *  the same size as a mantle mote and heavier, which is what "denser"
 *  means.  Per-material mass is then exact by construction, not by luck.   *
 * ---------------------------------------------------------------------- */
/* "one per sprite pixel" makes the cloud's resolution depend on the zoom
 * you happened to be at, which would make the physics depend on it too.
 * The pixel count is the ceiling; the floor is fixed.                     */
function moteCountFor(b) {
  const px = Math.max(4, b.radius * cam.scale);
  return clamp(Math.round(Math.PI * px * px * 0.55), 420, 6000);
}

function shatterBody(b, extraHeat) {
  const R = b.radius;
  const shells = b.shells;
  const ns = shells.length;
  if (!ns) return [];

  let N = moteCountFor(b);
  if (Motes.count + N > Motes.limit) N = Math.max(0, Motes.limit - Motes.count);
  if (N < ns * NMAT) N = Math.min(Motes.limit - Motes.count, ns * NMAT);
  if (N <= 0) return [];

  const inner = new Float64Array(ns);
  for (let k = 1; k < ns; k++) inner[k] = b.shellR[k - 1];

  /* first pass: place motes and pick a shell for each by chord length */
  const bx = new Float64Array(N), by = new Float64Array(N);
  const sh = new Int32Array(N);
  const buckets = []; for (let k = 0; k < ns; k++) buckets.push([]);
  const w = new Float64Array(ns);

  for (let i = 0; i < N; i++) {
    const q = R * Math.sqrt(rnd()), th = TAU * rnd();
    bx[i] = Math.cos(th) * q; by[i] = Math.sin(th) * q;
    let tot = 0;
    for (let k = 0; k < ns; k++) {
      const ro = b.shellR[k], ri = inner[k];
      const a = ro * ro - q * q, c = ri * ri - q * q;
      w[k] = 2 * ((a > 0 ? Math.sqrt(a) : 0) - (c > 0 ? Math.sqrt(c) : 0));
      tot += w[k];
    }
    let pick = ns - 1;
    if (tot > 0) {
      let u = rnd() * tot;
      for (let k = 0; k < ns; k++) { u -= w[k]; if (u <= 0) { pick = k; break; } }
    }
    sh[i] = pick; buckets[pick].push(i);
  }

  /* any shell that got no motes has to get some, or its material vanishes */
  for (let k = 0; k < ns; k++) {
    if (buckets[k].length) continue;
    let big = 0; for (let j = 1; j < ns; j++) if (buckets[j].length > buckets[big].length) big = j;
    if (!buckets[big].length) continue;
    const take = buckets[big].pop(); sh[take] = k; buckets[k].push(take);
  }

  const rMote = R * Math.sqrt(0.85 / N);
  const out = [];
  const cs = Math.cos(b.angle), sn = Math.sin(b.angle);

  for (let k = 0; k < ns; k++) {
    const list = buckets[k]; if (!list.length) continue;
    const c = shells[k].comp;
    const dq = extraHeat ? extraHeat[k] || 0 : 0;

    /* split this shell's motes between its materials by largest remainder,
     * with at least one mote for any material actually present.            */
    const mk = compTotal(c);
    const quota = new Int32Array(NMAT);
    for (let mt = 0; mt < NMAT; mt++)
      if (c[mt] > 0) quota[mt] = Math.max(1, Math.round(list.length * c[mt] / mk));

    /* Every material present gets at least one mote, and the shell spawns
     * however many that takes.  Capping the total at the bucket size
     * instead silently drops whatever did not fit, which is a hole in the
     * one thing this file promises: mass per material, exactly.          */
    let cursor = 0;
    for (let mt = 0; mt < NMAT; mt++) {
      const n = quota[mt]; if (!n) continue;
      const each = c[mt] / n;                 // exact: n motes carry this material's mass
      for (let q = 0; q < n; q++, cursor++) {
        const i = list[cursor % list.length];
        const px = bx[i], py = by[i];
        const wx = b.x + px * cs - py * sn, wy = b.y + px * sn + py * cs;
        /* rigid rotation, so angular momentum carries into the cloud */
        const vx = b.vx - b.spin * (wy - b.y), vy = b.vy + b.spin * (wx - b.x);
        const id = Motes.spawn(wx, wy, vx, vy, each, mt, addHeat(mt, shells[k].T, dq), rMote);
        if (id >= 0) out.push(id);
      }
    }
  }

  /* Spin about the CLOUD's centre of mass, not the body's nominal centre.
   * The mote positions are drawn at random and each material's mass is
   * then allotted across them, so the two centres do not coincide, and
   * rotating about the wrong one hands the cloud a net kick.  Measured:
   * a spinning world shattering walked the whole sky off by six parts in
   * a thousand of its own internal momentum, in one frame.               */
  if (out.length) {
    const M = Motes;
    let sm = 0, sx = 0, sy = 0;
    for (const i of out) { const m = M.m[i]; sm += m; sx += M.x[i] * m; sy += M.y[i] * m; }
    if (sm > 0) {
      const cx = sx / sm, cy = sy / sm;
      for (const i of out) {
        M.vx[i] = b.vx - b.spin * (M.y[i] - cy);
        M.vy[i] = b.vy + b.spin * (M.x[i] - cx);
      }
    }
  }
  return out;
}

/* ---- spatial hash ----------------------------------------------------- *
 *  One grid serves the contact pass, the neighbour count that drives
 *  cooling, and the connectivity pass that splits clouds.                  */
const Grid = {
  head: new Int32Array(1 << 18),
  next: new Int32Array(K.MOTE_CAP),
  mask: (1 << 18) - 1,
  cell: 1,
  /* the table is sized to the mote count, not to the cap.  Clearing a
   * quarter-million slots on every contact pass costs more than the
   * contacts do.                                                          */
  build(cellSize) {
    this.cell = cellSize > 1e-6 ? cellSize : 1;
    const M = Motes, n = M.count;
    let size = 64; while (size < n * 2 && size < (1 << 18)) size <<= 1;
    this.mask = size - 1;
    this.head.fill(-1, 0, size);
    const inv = 1 / this.cell;
    for (let i = 0; i < n; i++) {
      const k = this.key(Math.floor(M.x[i] * inv), Math.floor(M.y[i] * inv));
      this.next[i] = this.head[k]; this.head[k] = i;
    }
  },
  key(ix, iy) { return ((ix * 73856093) ^ (iy * 19349663)) & this.mask; },
};

/* ---- contacts --------------------------------------------------------- *
 *  Positional, not spring forces.  A spring stiff enough to hold a world
 *  up explodes the first time the clock runs at 60x; moving overlapping
 *  motes apart cannot, whatever dt is.  The separation is mass-weighted,
 *  so the centre of mass does not drift.  The normal impulse can only ever
 *  reduce an approach speed, never create one, and what it takes out comes
 *  back as heat.                                                           *
 * ---------------------------------------------------------------------- */
/* A spring stiff enough to hold a world up explodes the first time the
 * clock runs at 60x.  A positional pass cannot, whatever dt is.
 *
 *  The solver runs in three parts each substep: gravity kicks and drifts,
 *  the contact sweeps push overlapping motes apart by MOVING them, and the
 *  velocity is then read back off the positions.  Reading it back is what
 *  makes it lose energy, which is also what a pile of gravel does.
 *
 *  The guard that makes this safe is the design's own rule: the contact
 *  pass may only ever REDUCE a speed, never create one.  A mote leaves a
 *  substep no faster than gravity made it.  Without that bound a positional
 *  solver pumps -- pushing a pile apart does work against its own gravity,
 *  the pile falls back, and the fall is charged as heat again.  Measured,
 *  that pump ran at eight times the cloud's whole mechanical budget.       */
const PACK = 0.90;          // motes are uncompressed material; a pile weighs on itself
const CONTACT_ITERS = 8;    // Gauss-Seidel, alternating direction, so constraints propagate
const heatLedger = { joules: 0, created: 0 };
const _px = new Float64Array(K.MOTE_CAP), _py = new Float64Array(K.MOTE_CAP);
const _kx = new Float64Array(K.MOTE_CAP), _ky = new Float64Array(K.MOTE_CAP);

function positionSolve() {
  const M = Motes, n = M.count;
  if (n < 2) return;
  let maxR = 0;
  for (let i = 0; i < n; i++) if (M.r[i] > maxR) maxR = M.r[i];
  Grid.build(2 * maxR);
  M.nb.fill(0, 0, n);
  const inv = 1 / Grid.cell;
  for (let pass = 0; pass < CONTACT_ITERS; pass++)
    contactSweep(n, inv, pass === 0, pass & 1);
}

function contactSweep(n, inv, count, backward) {
  const M = Motes;
  for (let q = 0; q < n; q++) {
    const i = backward ? n - 1 - q : q;
    if (M.ghost[i]) continue;
    const ix = Math.floor(M.x[i] * inv), iy = Math.floor(M.y[i] * inv);
    for (let gx = ix - 1; gx <= ix + 1; gx++) for (let gy = iy - 1; gy <= iy + 1; gy++) {
      let j = Grid.head[Grid.key(gx, gy)];
      while (j >= 0) {
        if (j > i && !M.ghost[j]) {
          const dx = M.x[j] - M.x[i], dy = M.y[j] - M.y[i];
          const rs = (M.r[i] + M.r[j]) * PACK;
          const d2 = dx * dx + dy * dy;
          if (d2 < rs * rs && d2 > 1e-18) {
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
            if (count) { if (M.nb[i] < 255) M.nb[i]++; if (M.nb[j] < 255) M.nb[j]++; }
            const mi = M.m[i], mj = M.m[j], ms = mi + mj;
            if (ms <= 0) { j = Grid.next[j]; continue; }
            const push = Math.min((rs - d) * 0.6, M.r[i] + M.r[j]);
            const wi = mj / ms, wj = mi / ms;      // mass-weighted, so the centre holds still
            M.x[i] -= nx * push * wi; M.y[i] -= ny * push * wi;
            M.x[j] += nx * push * wj; M.y[j] += ny * push * wj;
          }
        }
        j = Grid.next[j];
      }
    }
  }
}

/* The velocity solve is separate from the position solve and it is
 * DIRECTIONAL: it removes the component of a pair's relative velocity
 * along the line of centres, and only where that component is closing.
 * Reading velocity back off the corrected positions instead lets a pair
 * leave as fast as it arrived, which is a perfectly elastic bounce, and
 * two worlds then rebound off each other instead of merging.             */
/* Reading the velocity back off the corrected positions is what makes the
 * pass lose energy, and it is also what stops it pumping.  Cancelling a
 * mote's DISPLACEMENT while leaving its velocity pointing inward lets that
 * velocity grow every substep under a load that never moves, and the mote
 * eventually squirts out sideways carrying energy nobody paid for.  The
 * readback is fully inelastic, which is what "rock arriving at rock keeps
 * almost none of its approach speed" says.                                */
function velocitiesFromPositions(h) {
  const M = Motes, n = M.count;
  for (let i = 0; i < n; i++) {
    if (M.ghost[i]) continue;
    M.vx[i] = (M.x[i] - _px[i]) / h;
    M.vy[i] = (M.y[i] - _py[i]) / h;
  }
}

const RESTITUTION = 0.04;     // kept for the body-scale hit-and-run impulse
function velocitySolve() {
  const M = Motes, n = M.count;
  if (n < 2) return;
  const inv = 1 / Grid.cell;
  for (let i = 0; i < n; i++) {
    if (M.ghost[i]) continue;
    const ix = Math.floor(M.x[i] * inv), iy = Math.floor(M.y[i] * inv);
    for (let gx = ix - 1; gx <= ix + 1; gx++) for (let gy = iy - 1; gy <= iy + 1; gy++) {
      let j = Grid.head[Grid.key(gx, gy)];
      while (j >= 0) {
        if (j > i && !M.ghost[j]) {
          const dx = M.x[j] - M.x[i], dy = M.y[j] - M.y[i];
          const rs = (M.r[i] + M.r[j]) * 1.02;
          const d2 = dx * dx + dy * dy;
          if (d2 < rs * rs && d2 > 1e-18) {
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
            const vn = (M.vx[j] - M.vx[i]) * nx + (M.vy[j] - M.vy[i]) * ny;
            if (vn < 0) {                          // closing, so this can only reduce
              const mi = M.m[i], mj = M.m[j], ms = mi + mj;
              if (ms > 0) {
                const jn = -(1 + RESTITUTION) * vn * (mi * mj / ms);
                M.vx[i] -= jn * nx / mi; M.vy[i] -= jn * ny / mi;
                M.vx[j] += jn * nx / mj; M.vy[j] += jn * ny / mj;
              }
            }
          }
        }
        j = Grid.next[j];
      }
    }
  }
}

/* ---- what the heat actually costs -------------------------------------- *
 *  Charging every velocity the solver removes as heat looks right and is
 *  a perpetual motion machine: a pile standing still under its own weight
 *  is kicked by gravity and held by its contacts every single substep, and
 *  none of that is dissipation, because the pile has not moved and its
 *  potential energy has not changed.  Measured, it ran at a tenth of a
 *  unit a step forever.
 *
 *  What a collapse really dissipates is the cloud's own mechanical energy:
 *  the kinetic energy in its own frame plus the self-potential of a
 *  uniform sphere, which is the same 3GM^2/5R the settling test uses.
 *  Gravity's work cancels between the two, so what is left over is the
 *  contacts, exactly.  It cannot dissipate more than the cloud has.       */
function cloudMechanical() {
  const M = Motes;
  let E = 0;
  for (const c of W.clumps) {
    if (c.mass <= 0 || c.R <= 0) continue;
    E -= 3 * K.G * c.mass * c.mass / (5 * c.R);
  }
  for (let i = 0; i < M.count; i++) {
    const ci = M.clump[i]; if (ci < 0 || M.ghost[i]) continue;
    const c = W.clumps[ci];
    const ux = M.vx[i] - c.vx, uy = M.vy[i] - c.vy;
    E += 0.5 * M.m[i] * (ux * ux + uy * uy);
  }
  return E;
}

/*  The books run both ways.  Charging every mechanical loss as heat while
 *  letting every mechanical gain go free turns a cloud that merely
 *  breathes into a furnace: the collapse half of each oscillation is
 *  billed and the expansion half is not, and the temperature climbs
 *  without limit on a cloud that is going nowhere.                        */
function depositHeat(joulesSim) {
  if (!joulesSim) return;
  const M = Motes, n = M.count;
  let w = 0;
  for (let i = 0; i < n; i++) {
    if (M.ghost[i] || M.clump[i] < 0) continue;
    w += M.m[i] * (M.nb[i] + 0.25);
  }
  if (w <= 0) return;
  heatLedger.joules += joulesSim;
  const vel2J = SI.vel * SI.vel;
  for (let i = 0; i < n; i++) {
    if (M.ghost[i] || M.clump[i] < 0) continue;
    const share = joulesSim * (M.nb[i] + 0.25) / w;      // per unit mass already
    M.T[i] = addHeat(M.mat[i], M.T[i], share * vel2J);
  }
}

const CP = [450, 1000, 710, 2100, 5200];      // J/kg/K
function cpOf(mat) { return CP[mat]; }

/* ---- enthalpy ---------------------------------------------------------- *
 *  Temperature is not a linear function of energy.  A melt sitting at its
 *  boiling point absorbs the latent heat of vaporisation without getting
 *  any hotter, and silicate's is 1.3e7 J/kg, which is eight times what
 *  melting it costs.  Adding energy straight to a temperature instead puts
 *  a merged pair of Earths at 100,000 K, which is not a magma ocean and
 *  not anything else either.                                              *
 * ---------------------------------------------------------------------- */
const LATENT = [
  /* Fe  */ { fus: 2.47e5, boil: 3134, vap: 6.09e6 },
  /* Si  */ { fus: 4.00e5, boil: 3200, vap: 1.30e7 },
  /* C   */ { fus: 1.20e5, boil: 4300, vap: 6.00e7 },
  /* H2O */ { fus: 3.34e5, boil: 373,  vap: 2.26e6 },
  /* HHe */ { fus: 0,      boil: 0,    vap: 0 },
];
function enthalpy(mat, T) {
  const cp = CP[mat], L = LATENT[mat], m = MATS[mat].melt;
  if (!L.boil) return cp * T;
  let h = cp * Math.min(T, m);
  if (T <= m) return h;
  h += L.fus + cp * (Math.min(T, L.boil) - m);
  if (T <= L.boil) return h;
  return h + L.vap + cp * (T - L.boil);
}
function tempFromEnthalpy(mat, h) {
  const cp = CP[mat], L = LATENT[mat], m = MATS[mat].melt;
  if (!L.boil) return h / cp;
  const hm = cp * m;
  if (h <= hm) return h / cp;
  if (h <= hm + L.fus) return m;                       // melting, at constant T
  const hb = hm + L.fus + cp * (L.boil - m);
  if (h <= hb) return m + (h - hm - L.fus) / cp;
  if (h <= hb + L.vap) return L.boil;                  // boiling, at constant T
  return L.boil + (h - hb - L.vap) / cp;
}
/* add dq joules per kilogram and return where that leaves the temperature */
function addHeat(mat, T, dq) {
  if (!dq) return T;
  return Math.max(AMBIENT_T, tempFromEnthalpy(mat, Math.max(0, enthalpy(mat, T) + dq)));
}

/* ---- clumps ----------------------------------------------------------- *
 *  Re-split by spatial connectivity a few times a second, so when one
 *  cloud pulls into two, each half starts holding itself together
 *  separately.  That is what lets a stretched world pinch off a bead
 *  instead of smearing into an endless string.                             *
 * ---------------------------------------------------------------------- */
const _uf = new Int32Array(K.MOTE_CAP);
function ufFind(a) { while (_uf[a] !== a) { _uf[a] = _uf[_uf[a]]; a = _uf[a]; } return a; }
function ufUnion(a, b) { a = ufFind(a); b = ufFind(b); if (a !== b) _uf[b] = a; }

function rebuildClumps() {
  const M = Motes, n = M.count;
  W.clumps.length = 0;
  if (!n) return;
  let maxR = 0;
  for (let i = 0; i < n; i++) if (M.r[i] > maxR) maxR = M.r[i];
  const link = 2.2;   // a pile that has puffed a little is still one pile
  Grid.build(2 * maxR * link);
  const inv = 1 / Grid.cell;
  for (let i = 0; i < n; i++) _uf[i] = i;

  for (let i = 0; i < n; i++) {
    const ix = Math.floor(M.x[i] * inv), iy = Math.floor(M.y[i] * inv);
    for (let gx = ix - 1; gx <= ix + 1; gx++) for (let gy = iy - 1; gy <= iy + 1; gy++) {
      let j = Grid.head[Grid.key(gx, gy)];
      while (j >= 0) {
        if (j > i) {
          const dx = M.x[j] - M.x[i], dy = M.y[j] - M.y[i];
          const rs = (M.r[i] + M.r[j]) * link;
          if (dx * dx + dy * dy < rs * rs) ufUnion(i, j);
        }
        j = Grid.next[j];
      }
    }
  }

  const idx = new Map();
  for (let i = 0; i < n; i++) {
    const root = ufFind(i);
    let c = idx.get(root);
    if (c === undefined) {
      c = W.clumps.length; idx.set(root, c);
      W.clumps.push({ n: 0, mass: 0, cx: 0, cy: 0, vx: 0, vy: 0, R: 0, rmax: 0,
                      comp: zeroComp(), L: 0, I: 0, omega: 0, rockT: 0, rockM: 0,
                      axisRatio: 1, first: -1, settleAge: 0, ke: 0, mr2: 0, rfar: 0 });
    }
    M.clump[i] = c;
  }
  measureClumps();
}

/* Re-splitting by connectivity is the expensive half and runs a few times
 * a second.  Measuring where each cloud IS is cheap and has to run every
 * step: a monopole aimed at where the cloud was a second ago pulls every
 * mote sideways, and after the self-force is removed that comes out as a
 * shear that tears the cloud apart.                                       */
let _sxx = new Float64Array(256), _syy = new Float64Array(256), _sxy = new Float64Array(256);
function measureClumps() {
  const M = Motes, n = M.count;
  for (const c of W.clumps) {
    c.n = 0; c.mass = 0; c.cx = 0; c.cy = 0; c.vx = 0; c.vy = 0;
    c.R = 0; c.rmax = 0; c.rfar = 0; c.mr2 = 0; c.L = 0; c.I = 0; c.rockT = 0; c.rockM = 0;
    c.first = -1; c.comp.fill(0);
  }
  /* one pass for mass and centre, a second for everything measured from it */
  for (let i = 0; i < n; i++) {
    if (M.clump[i] < 0 || M.ghost[i]) continue;
    const c = W.clumps[M.clump[i]], m = M.m[i];
    c.n++; c.mass += m; c.cx += M.x[i] * m; c.cy += M.y[i] * m;
    c.vx += M.vx[i] * m; c.vy += M.vy[i] * m;
    c.comp[M.mat[i]] += m;
    if (M.mat[i] <= MAT.C) { c.rockM += m; c.rockT += m * M.T[i]; }
    if (M.r[i] > c.rmax) c.rmax = M.r[i];
    if (c.first < 0) c.first = i;
  }
  for (const c of W.clumps) {
    if (c.mass > 0) { c.cx /= c.mass; c.cy /= c.mass; c.vx /= c.mass; c.vy /= c.mass; }
    if (c.rockM > 0) c.rockT /= c.rockM;
  }
  /* second moments: angular momentum, spread, and how round it is.
   * The scratch is hoisted because this runs every mote substep, and
   * three fresh arrays a substep is a hundred a frame for the collector. */
  const nc = W.clumps.length;
  if (_sxx.length < nc) {
    _sxx = new Float64Array(nc * 2); _syy = new Float64Array(nc * 2); _sxy = new Float64Array(nc * 2);
  }
  const sxx = _sxx, syy = _syy, sxy = _sxy;
  sxx.fill(0, 0, nc); syy.fill(0, 0, nc); sxy.fill(0, 0, nc);
  for (let i = 0; i < n; i++) {
    const ci = M.clump[i]; if (ci < 0 || M.ghost[i]) continue;
    const c = W.clumps[ci], m = M.m[i];
    const dx = M.x[i] - c.cx, dy = M.y[i] - c.cy;
    const ux = M.vx[i] - c.vx, uy = M.vy[i] - c.vy;
    c.L += m * (dx * uy - dy * ux);
    c.I += m * (dx * dx + dy * dy);
    sxx[ci] += m * dx * dx; syy[ci] += m * dy * dy; sxy[ci] += m * dx * dy;
    c.mr2 += m * (dx * dx + dy * dy);
    const rr = Math.hypot(dx, dy); if (rr > c.rfar) c.rfar = rr;
  }
  for (let k = 0; k < W.clumps.length; k++) {
    const c = W.clumps[k];
    c.omega = c.I > 1e-12 ? c.L / c.I : 0;
    const a = sxx[k] / c.mass, b = syy[k] / c.mass, d = sxy[k] / c.mass;
    const tr = a + b, det = a * b - d * d;
    const disc = Math.max(0, tr * tr / 4 - det);
    const l1 = tr / 2 + Math.sqrt(disc), l2 = tr / 2 - Math.sqrt(disc);
    c.axisRatio = l1 > 1e-12 ? Math.sqrt(Math.max(0, l2) / l1) : 1;
    /* the radius of the uniform sphere with this cloud's second moment.
     * The furthest mote is not it: one stray puts the whole cloud's
     * self-potential somewhere else, and that jump is a free joule.      */
    c.R = Math.max(c.rmax, c.mass > 0 ? Math.sqrt(5 / 3 * c.mr2 / c.mass) : 0);
  }
}

/* ---- the field a cloud makes on itself ---------------------------------- *
 *  Pulling every mote toward the cloud's centre with the cloud's WHOLE
 *  mass is right outside the cloud and badly wrong inside it: a mote near
 *  the middle has almost no mass inside its own radius, and the full
 *  monopole gives it an acceleration of several thousand.  The cloud
 *  implodes, the contact pass shoves it back out, and it detonates.
 *
 *  Using a tabulated enclosed mass fixes the force and breaks the energy,
 *  because a field that depends on the configuration is not conservative:
 *  the profile shifts under the motes as they move and every shift is a
 *  free joule.  Measured, that leak was eight times the cloud's whole
 *  mechanical budget, and it came out as thirty thousand kelvin.
 *
 *  The uniform sphere is the honest monopole for a roughly round blob.
 *  It is exact inside and out, it has no central singularity, and given a
 *  mass and a radius it is a fixed central potential, so it conserves.
 *  Its binding energy is 3GM^2/5R, which is the number §5 already tests
 *  settling against.                                                      */
function cloudAccel(M, R, d) {
  if (R <= 1e-9) return 0;
  if (d >= R) return K.G * M / (d * d + 1e-12);
  return K.G * M * d / (R * R * R);
}

/* ---- mote dynamics ---------------------------------------------------- *
 *  Motes feel only the heaviest handful of bodies, plus the monopole of
 *  their own cloud.  Below the top six by mass nothing measurably pulls on
 *  a mote, so a busy sky evaluates six sources per particle whatever is in
 *  it.  Motes do not pull on each other pairwise; a roughly round blob is
 *  dominated by its monopole, and that costs one pass instead of n^2.      *
 *                                                                         *
 *  Cohesion is a field, so a cloud that is not round pushes on itself.
 *  The net of it is measured each step and handed back, because nothing
 *  pulls on itself.                                                        *
 * ---------------------------------------------------------------------- */
Motes.ghost = new Uint8Array(K.MOTE_CAP);
const _cax = new Float64Array(K.MOTE_CAP), _cay = new Float64Array(K.MOTE_CAP);
let _cnx = new Float64Array(256), _cny = new Float64Array(256);
let _cgx = new Float64Array(256), _cgy = new Float64Array(256);
let _isTop = new Uint8Array(256);
let _clumpOrder = new Int32Array(0);
function clumpScratch(nc) {
  if (_cnx.length < nc) { _cnx = new Float64Array(nc * 2); _cny = new Float64Array(nc * 2); }
  _cnx.fill(0, 0, nc); _cny.fill(0, 0, nc);
}
function clumpAccelScratch(nc) {
  if (_cgx.length < nc) { _cgx = new Float64Array(nc * 2); _cgy = new Float64Array(nc * 2); }
  if (_isTop.length < nc) _isTop = new Uint8Array(nc * 2);
  _cgx.fill(0, 0, nc); _cgy.fill(0, 0, nc); _isTop.fill(0, 0, nc);
}

/* The heaviest few clouds, by mass, as indices into W.clumps. */
function heaviestClumps(k) {
  const nc = W.clumps.length;
  let order = _clumpOrder;
  if (order.length !== nc) order = _clumpOrder = new Int32Array(nc);
  for (let i = 0; i < nc; i++) order[i] = i;
  return Array.prototype.slice.call(order)
    .sort((a, b) => W.clumps[b].mass - W.clumps[a].mass).slice(0, k);
}

/* Two uniform spheres, centre to centre.  Outside each other it is the
 * plain inverse square; once the smaller is inside the larger it is the
 * larger's interior field, which is linear in the separation and finite
 * at the middle.  Written as a FORCE rather than an acceleration because
 * the whole point is that both clouds get the same number back.          */
function pairForce(mA, RA, mB, RB, d) {
  const Reff = Math.max(RA, RB);
  if (d >= Reff) return K.G * mA * mB / (d * d + 1e-12);
  return K.G * mA * mB * d / (Reff * Reff * Reff + 1e-18);
}
const escapedMass = zeroComp();
const SCENE_BOUND = 400000;

function topSources(n) {
  const bs = W.bodies.slice().sort((a, b) => b.mass - a.mass);
  return bs.slice(0, n);
}

const _bfx = new Float64Array(16), _bfy = new Float64Array(16);

function stepMotes(dt) {
  const M = Motes, n = M.count;
  if (!n) return;
  const src = topSources(6);
  const ns = src.length;

  /* Body gravity, and the SAME force the other way.  A body that pulls on
   * a mote and feels nothing back is a momentum pump, and it is invisible
   * until a body settles out of a melt while the rest of the melt is
   * still rubble: three bodies among five hundred motes walked the whole
   * sky off at four percent of its own internal momentum, all of it
   * arriving after the first settle.  The reaction is summed per source
   * and delivered once, so it costs one pass over the sources, not one
   * over the motes.                                                       */
  for (let s = 0; s < ns; s++) { _bfx[s] = 0; _bfy[s] = 0; }
  for (let i = 0; i < n; i++) {
    let ax = 0, ay = 0;
    const mi = M.m[i], live = !M.ghost[i];
    for (let s = 0; s < ns; s++) {
      const b = src[s];
      const dx = b.x - M.x[i], dy = b.y - M.y[i];
      const r2 = dx * dx + dy * dy + K.SOFT2;
      const inv = b.mass / (r2 * Math.sqrt(r2));
      const gx = dx * inv, gy = dy * inv;
      ax += gx; ay += gy;
      /* a ghost has no mass on the books and is not integrated, so it
       * neither pulls nor is pulled                                       */
      if (live) { _bfx[s] -= mi * gx; _bfy[s] -= mi * gy; }
    }
    _cax[i] = ax; _cay[i] = ay;
  }
  for (let s = 0; s < ns; s++) {
    const b = src[s];
    if (b.mass > 0) { b.vx += _bfx[s] / b.mass * dt; b.vy += _bfy[s] / b.mass * dt; }
  }

  /* Cloud cohesion.  A mote feels its OWN cloud as a uniform sphere with
   * itself left out, and it feels the heaviest few other clouds as well.
   *
   * Leaving the other clouds out is what the design's monopole rule reads
   * like, and it makes fragmentation permanent: the instant a shock puffs
   * a melt into seven pieces the pieces stop attracting each other and
   * drift apart in straight lines forever, no mote anywhere near escape
   * velocity.  It also makes §8.6 impossible, because fragments sharing a
   * patch of sky can never pull together into a body if they cannot feel
   * each other.  The heaviest eight is the same bargain the top-six body
   * rule strikes: a fixed number of sources per particle whatever is in
   * the sky.                                                              */
  const nc = W.clumps.length;
  if (nc) {
    clumpScratch(nc);
    clumpAccelScratch(nc);
    const netx = _cnx, nety = _cny, cgx = _cgx, cgy = _cgy;
    const top = heaviestClumps(8);
    for (let t = 0; t < top.length; t++) _isTop[top[t]] = 1;

    /* -- cloud on cloud, PAIR BY PAIR ---------------------------------- *
     *  Aiming each cloud's monopole at each mote of the other separately
     *  is not equal and opposite: cloud A's pull on B is summed over B's
     *  motes at their own distances and with A's radius, and B's pull on
     *  A is a different sum entirely.  The two do not cancel, and a
     *  head-on merge released from rest walks off at four percent of its
     *  own internal momentum.  One force per pair, applied uniformly to
     *  each cloud's motes, is exact to the last bit however the motes are
     *  arranged.  It costs the tide between two clouds, which a monopole
     *  never had any business claiming to resolve anyway.
     *
     *  The pair SET is still the heaviest-eight bargain: every pair with
     *  a heavy cloud in it is evaluated, and light-on-light is dropped.
     *  Which pairs are in the set does not matter to conservation - only
     *  that a pair, once in, gets both halves of its force.              */
    for (let t = 0; t < top.length; t++) {
      const a = top[t], A = W.clumps[a];
      if (A.mass <= 0) continue;
      for (let b = 0; b < nc; b++) {
        if (b === a || (_isTop[b] && b < a)) continue;   // each pair exactly once
        const B = W.clumps[b];
        if (B.mass <= 0) continue;
        const dx = B.cx - A.cx, dy = B.cy - A.cy;
        const d = Math.hypot(dx, dy);
        if (d < 1e-12) continue;
        const f = pairForce(A.mass, A.R, B.mass, B.R, d) / d;
        cgx[a] += f * dx / A.mass; cgy[a] += f * dy / A.mass;
        cgx[b] -= f * dx / B.mass; cgy[b] -= f * dy / B.mass;
      }
    }

    /* -- a cloud on itself --------------------------------------------- */
    for (let i = 0; i < n; i++) {
      if (M.ghost[i]) continue;
      const own = M.clump[i];
      if (own >= 0) {
        const c = W.clumps[own];
        const Meff = c.mass - M.m[i];                  // nothing pulls on itself
        if (Meff <= 0) continue;
        const dx = c.cx - M.x[i], dy = c.cy - M.y[i];
        const d = Math.hypot(dx, dy);
        if (d < 1e-12) continue;
        const g = cloudAccel(Meff, c.R, d) / d;
        const ax = dx * g, ay = dy * g;
        _cax[i] += ax; _cay[i] += ay;
        /* a cloud that is not round pushes on itself; the net of that is
         * spurious and is handed back below                              */
        netx[own] += M.m[i] * ax; nety[own] += M.m[i] * ay;
      } else {
        /* A mote spawned since the last connectivity pass belongs to no
         * cloud yet.  It still feels the heaviest few, and they feel it
         * back - otherwise every shatter is a free kick.                 */
        for (let t = 0; t < top.length; t++) {
          const ci = top[t], c = W.clumps[ci];
          if (c.mass <= 0) continue;
          const dx = c.cx - M.x[i], dy = c.cy - M.y[i];
          const d = Math.hypot(dx, dy);
          if (d < 1e-12) continue;
          const g = cloudAccel(c.mass, c.R, d) / d;
          const ax = dx * g, ay = dy * g;
          _cax[i] += ax; _cay[i] += ay;
          cgx[ci] -= M.m[i] * ax / c.mass; cgy[ci] -= M.m[i] * ay / c.mass;
        }
      }
    }

    /* every mote of a cloud gets that cloud's bulk pull, and gives back
     * its share of the cloud's spurious grip on itself                   */
    for (let i = 0; i < n; i++) {
      if (M.ghost[i]) continue;
      const ci = M.clump[i]; if (ci < 0) continue;
      const c = W.clumps[ci]; if (c.mass <= 0) continue;
      _cax[i] += cgx[ci] - netx[ci] / c.mass;
      _cay[i] += cgy[ci] - nety[ci] / c.mass;
    }
  }

  /* symplectic (kick then drift), so a mote on a long orbit keeps it.
   * Both the pre-drift position and the post-kick velocity are kept, so
   * the contact solver can be read back against them.                     */
  for (let i = 0; i < n; i++) {
    if (M.ghost[i]) { M.x[i] += M.vx[i] * dt; M.y[i] += M.vy[i] * dt; continue; }
    M.vx[i] += _cax[i] * dt; M.vy[i] += _cay[i] * dt;
    _px[i] = M.x[i]; _py[i] = M.y[i];
    _kx[i] = M.vx[i]; _ky[i] = M.vy[i];
    M.x[i] += M.vx[i] * dt;  M.y[i] += M.vy[i] * dt;
    M.age[i] += dt;
  }
}

/* ---- differentiation --------------------------------------------------- *
 *  While a cloud is molten, denser motes sink.  The drift rate is density
 *  contrast over viscosity, and viscosity is steep in temperature, so
 *  cooling races the sort.  A large hot melt separates almost completely;
 *  a small or fast-cooling one freezes part-sorted, and that is where the
 *  swirl comes from.  No noise is added anywhere to make it look swirly.   *
 * ---------------------------------------------------------------------- */
/* Denser motes sink at a TERMINAL speed set by density contrast over
 * viscosity, the way Stokes settling works.  Adding that as an
 * acceleration every step instead makes it integrate without bound and
 * blows the cloud apart, which is what it did the first time.            */
const DIFF_SPEED = 0.035, DIFF_RELAX = 4;
function differentiate(dt) {
  const M = Motes, n = M.count, nc = W.clumps.length;
  if (!n || !nc) return;
  clumpScratch(nc);
  const dvx = _cnx, dvy = _cny;
  const meanRho = new Float64Array(nc);
  for (let k = 0; k < nc; k++) {
    const c = W.clumps[k]; let v = 0;
    for (let mt = 0; mt < NMAT; mt++) v += c.comp[mt] / matRho(mt, c.rockT || 300);
    meanRho[k] = v > 0 ? c.mass / v : 1;
  }
  const scratchX = _cax, scratchY = _cay;
  for (let i = 0; i < n; i++) {
    scratchX[i] = 0; scratchY[i] = 0;
    if (M.ghost[i]) continue;
    const ci = M.clump[i]; if (ci < 0) continue;
    const c = W.clumps[ci];
    if (c.n < 12 || c.R <= 0) continue;
    const mob = mobility(M.mat[i], M.T[i]);
    if (mob < 1e-3) continue;
    const rho = matRho(M.mat[i], M.T[i]);
    const contrast = (rho - meanRho[ci]) / meanRho[ci];
    if (Math.abs(contrast) < 1e-3) continue;
    const dx = c.cx - M.x[i], dy = c.cy - M.y[i];
    const d = Math.hypot(dx, dy); if (d < 1e-9) continue;
    const ux = dx / d, uy = dy / d;
    const vff = Math.sqrt(K.G * c.mass / Math.max(c.R, 1e-6));
    const target = DIFF_SPEED * clamp(contrast, -1, 1) * Math.min(1, mob) * vff;
    const vr = (M.vx[i] - c.vx) * ux + (M.vy[i] - c.vy) * uy;   // radial, inward positive
    const dv = (target - vr) * clamp(dt * DIFF_RELAX, 0, 0.5);
    const ax = ux * dv, ay = uy * dv;
    scratchX[i] = ax; scratchY[i] = ay;
    dvx[ci] += M.m[i] * ax; dvy[ci] += M.m[i] * ay;
  }
  for (let i = 0; i < n; i++) {
    const ci = M.clump[i]; if (ci < 0 || M.ghost[i]) continue;
    const c = W.clumps[ci]; if (c.mass <= 0) continue;
    M.vx[i] += scratchX[i] - dvx[ci] / c.mass;      // net removed: sorting is internal
    M.vy[i] += scratchY[i] - dvy[ci] / c.mass;
  }
}

/* ---- cooling ----------------------------------------------------------- *
 *  Heat leaves through the surface.  A mote packed in among five or six
 *  others is not the surface and holds its heat about twice as long as one
 *  out on the skin; the neighbour count comes from the contact pass, which
 *  is already visiting every touching pair.                                *
 * ---------------------------------------------------------------------- */
let AMBIENT_T = 30;
function coolMotes(dt) {
  const M = Motes, n = M.count;
  if (!n) return;
  const dtSI = dt * (K.SI_YEAR / YEAR_UNITS);
  const amb4 = Math.pow(AMBIENT_T, 4);
  for (let i = 0; i < n; i++) {
    if (M.ghost[i]) continue;
    const T = M.T[i];
    if (T <= AMBIENT_T + 0.5) { M.T[i] = AMBIENT_T; continue; }
    const rSI = SI.radius(M.r[i]), mSI = SI.mass(M.m[i]);
    if (mSI <= 0 || rSI <= 0) continue;
    const A = 4 * Math.PI * rSI * rSI;
    const exposure = 1 / (1 + M.nb[i] / 6);
    const P = K.SI_SB * A * (T * T * T * T - amb4) * exposure;
    let dT = -P * dtSI / (mSI * cpOf(M.mat[i]));
    if (dT < -(T - AMBIENT_T)) dT = -(T - AMBIENT_T);      // never overshoot ambient
    M.T[i] = T + dT;
  }
}

/* ====================================================================== *
 *  5b. SETTLING: FROM MELT BACK TO WORLD                                 *
 * ---------------------------------------------------------------------- *
 *  A cloud becomes a body again when three things are true at once, none
 *  of them on a timer:
 *    1. its own binding energy beats the motion inside it, measured in its
 *       own frame with the bulk rotation taken out.  Spin does not count;
 *       a cloud turning as a whole is already a body.  It keeps the turn.
 *    2. its rock is below the melting point, measured over the rock only.
 *       Gas has no melting point, so two gas giants re-form as soon as
 *       gravity has gathered them.
 *    3. it is round, by the ratio of the principal axes of its own mass.
 * ====================================================================== */
const spriteGhosts = [];         // §5.4: nothing pops

/* one pass over the motes fills every clump's internal kinetic energy,
 * rather than one pass per clump.                                         */
function clumpInternalKE() {
  const M = Motes;
  for (const c of W.clumps) c.ke = 0;
  for (let i = 0; i < M.count; i++) {
    const ci = M.clump[i];
    if (ci < 0 || M.ghost[i]) continue;
    const c = W.clumps[ci];
    const dx = M.x[i] - c.cx, dy = M.y[i] - c.cy;
    const ux = M.vx[i] - c.vx + c.omega * dy;      // bulk rotation removed
    const uy = M.vy[i] - c.vy - c.omega * dx;
    c.ke += 0.5 * M.m[i] * (ux * ux + uy * uy);
  }
}

function rockMeltPoint(comp) {
  let w = 0, s = 0;
  for (let mt = 0; mt <= MAT.C; mt++) { w += comp[mt]; s += comp[mt] * MATS[mt].melt; }
  return w > 0 ? s / w : 0;
}

/* how round a cloud has to be.  Under a real tide the equilibrium figure
 * is prolate, so holding out for a sphere would mean nothing near a black
 * hole ever pulled itself together again.  The allowance is the tide it is
 * actually in, and with no tide it is the plain sphere test.              */
function roundnessFloor(c) {
  let worst = 0;
  for (const b of W.bodies) {
    const dx = b.x - c.cx, dy = b.y - c.cy;
    const d = Math.hypot(dx, dy);
    if (d < 1e-6) continue;
    const q = (b.mass / (c.mass + 1e-30)) * Math.pow(c.R / d, 3);
    if (q > worst) worst = q;
  }
  return clamp(0.72 - 1.6 * Math.min(worst, 0.3), 0.30, 0.72);
}

function trySettle() {
  const M = Motes;
  clumpInternalKE();
  for (let ci = 0; ci < W.clumps.length; ci++) {
    const c = W.clumps[ci];
    if (c.n < 10 || c.mass <= 0 || c.R <= 0) continue;

    const bind = 3 * K.G * c.mass * c.mass / (5 * c.R);
    const ke = c.ke;
    if (ke >= bind) { c.settleAge = 0; continue; }

    const rockFrac = (c.comp[MAT.Fe] + c.comp[MAT.Si] + c.comp[MAT.C]) / c.mass;
    if (rockFrac > 0.05 && c.rockT > rockMeltPoint(c.comp)) { c.settleAge = 0; continue; }

    if (c.axisRatio < roundnessFloor(c)) { c.settleAge = 0; continue; }

    settleClump(ci, c);
    return;                                   // one per pass; the rest re-check next time
  }
}

function settleClump(ci, c) {
  const M = Motes;
  const members = [];
  for (let i = 0; i < M.count; i++) if (M.clump[i] === ci && !M.ghost[i]) members.push(i);
  if (members.length < 4) return;

  /* radial bins by cumulative mass, so a well-sorted melt gives near-pure
   * shells and a part-sorted one gives mixed ones.  The interruption is
   * the record of how the collision went, and it is kept.                 */
  members.sort((a, b) => {
    const da = (M.x[a] - c.cx) ** 2 + (M.y[a] - c.cy) ** 2;
    const db = (M.x[b] - c.cx) ** 2 + (M.y[b] - c.cy) ** 2;
    return da - db;
  });
  const nBins = c.mass >= DIFF_MASS ? 4 : 1;
  const per = c.mass / nBins;
