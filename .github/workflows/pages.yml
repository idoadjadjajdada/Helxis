# Publish Helxis to GitHub Pages.
#
# There is nothing to build. The app is vanilla ES modules and one canvas, and
# it runs from any static host as-is — the only reason `npm start` exists is
# that modules will not load over file://. So this uploads the app's own files
# and nothing else: no test suite, no scripts, no working notes.
#
# Deploying the repository root instead would also work and would need no
# workflow at all (Settings -> Pages -> Deploy from a branch -> main / root).
# This exists to keep the published site to the eight paths that are actually
# the app, so that what is served is the thing and not the workshop around it.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than cancelling it
# half way through an upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html style.css src fonts _site/
          # Tells Pages not to run the files through Jekyll, which would
          # otherwise skip anything beginning with an underscore.
          touch _site/.nojekyll

      - name: Check nothing references a path that will not exist
        run: |
          # Every asset reference has to be relative: a project page is served
          # from /<repo>/, so a leading slash resolves to the wrong host root.
          if grep -rnE '(src|href)="/|url\(/' _site/index.html _site/style.css; then
            echo "::error::absolute path found — it will 404 under /<repo>/"
            exit 1
          fi
          test -f _site/src/main.js
          test -f _site/fonts/hanken.woff2

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
